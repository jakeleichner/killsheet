/* Mobile detection hook */
function useIsMobile(breakpoint) {
  const bp = breakpoint || 700;
  const [mobile, setMobile] = useState(typeof window !== "undefined" && window.innerWidth < bp);
  if (typeof window !== "undefined") {
    const handler = () => setMobile(window.innerWidth < bp);
    if (!useIsMobile._bound) { window.addEventListener("resize", handler); useIsMobile._bound = true; }
  }
  return mobile;
}

/* ═══ PERSISTENCE ═══ */
const LS_PREFIX = "ks_";
function useLocalStorage(key, initialValue) {
  const fullKey = LS_PREFIX + key;
  const [value, setValue] = useState(() => {
    try {
      if (typeof window === "undefined") return initialValue;
      const stored = window.localStorage.getItem(fullKey);
      return stored !== null ? JSON.parse(stored) : initialValue;
    } catch (e) { return initialValue; }
  });
  useEffect(() => {
    try {
      if (typeof window === "undefined") return;
      window.localStorage.setItem(fullKey, JSON.stringify(value));
    } catch (e) { /* quota or serialization errors ignored */ }
  }, [fullKey, value]);
  return [value, setValue];
}
function clearKillSheetStorage() {
  try {
    if (typeof window === "undefined") return;
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.indexOf(LS_PREFIX) === 0) keys.push(k);
    }
    keys.forEach(k => window.localStorage.removeItem(k));
  } catch (e) { /* ignore */ }
}

/* ═══ MULTIPLAYER (PeerJS peer-to-peer) ═══ */
const MP_PREFIX = "KS-";
// ICE config: multiple STUN servers (redundancy) plus ExpressTURN TURN servers for symmetric-NAT fallback.
// TURN traffic is encrypted end-to-end; the relay just forwards opaque packets.
const ICE_CONFIG = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun.cloudflare.com:3478" },
    { urls: "stun:global.stun.twilio.com:3478" },
    // ExpressTURN free tier — UDP, TCP, and TCP-on-443 (firewall bypass)
    { urls: "turn:free.expressturn.com:3478", username: "000000002093370707", credential: "c2p512k7LlW6Rc9l98gsjjQkdAo=" },
    { urls: "turn:free.expressturn.com:3478?transport=tcp", username: "000000002093370707", credential: "c2p512k7LlW6Rc9l98gsjjQkdAo=" },
    { urls: "turn:free.expressturn.com:443?transport=tcp", username: "000000002093370707", credential: "c2p512k7LlW6Rc9l98gsjjQkdAo=" },
  ],
};
function genRoomCode() {
  // 6-char base32 (avoid 0/O/I/1 confusion)
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  return s;
}
function useMultiplayer(onMessage) {
  // status: 'idle' | 'hosting' | 'joining' | 'connected' | 'error'
  const [status, setStatus] = useState("idle");
  const [role, setRole] = useState(null); // 'host' | 'guest' | null
  const [roomCode, setRoomCode] = useState(null);
  const [peerError, setPeerError] = useState("");
  const [peerRef, setPeerRef] = useState(null);
  const [connRef, setConnRef] = useState(null);
  const onMessageRef = React.useRef(onMessage);
  useEffect(() => { onMessageRef.current = onMessage; }, [onMessage]);

  const cleanup = () => {
    try { if (connRef) connRef.close(); } catch (e) {}
    try { if (peerRef) peerRef.destroy(); } catch (e) {}
    setConnRef(null);
    setPeerRef(null);
  };

  const wireConnection = (conn) => {
    conn.on("open", () => { setStatus("connected"); setPeerError(""); });
    conn.on("data", (msg) => { if (onMessageRef.current) onMessageRef.current(msg); });
    conn.on("close", () => { setStatus("idle"); setRole(null); setRoomCode(null); });
    conn.on("error", (err) => {
      const msg = String(err && err.message || err);
      let friendly = msg;
      if (msg.indexOf("Negotiation") !== -1) {
        friendly = "Connection failed — likely a network/firewall issue. Try a different network, or use export/import codes as a fallback.";
      }
      setPeerError(friendly);
      setStatus("error");
    });
    setConnRef(conn);
  };

  const host = () => {
    if (typeof window === "undefined" || !window.Peer) { setPeerError("PeerJS not loaded"); setStatus("error"); return; }
    cleanup();
    const code = genRoomCode();
    const peer = new window.Peer(MP_PREFIX + code, { debug: 0, config: ICE_CONFIG });
    setPeerRef(peer);
    setStatus("hosting");
    setRole("host");
    setRoomCode(code);
    peer.on("open", () => { /* waiting for guest */ });
    peer.on("connection", (conn) => { wireConnection(conn); });
    peer.on("error", (err) => {
      const msg = String(err && err.message || err);
      // ID-taken means someone else has our random code; retry once
      if (msg.indexOf("is taken") !== -1 || msg.indexOf("unavailable-id") !== -1) {
        setTimeout(() => host(), 100);
        return;
      }
      // Translate common opaque errors into user-friendly text
      let friendly = msg;
      if (msg.indexOf("Negotiation") !== -1) friendly = "Connection failed — likely a network/firewall issue. Try a different network or use export/import codes.";
      else if (msg.indexOf("network") !== -1 || msg.indexOf("Network") !== -1) friendly = "Network error — check your internet connection.";
      else if (msg.indexOf("server-error") !== -1) friendly = "PeerJS broker is having issues. Try again in a minute.";
      setPeerError(friendly);
      setStatus("error");
    });
  };

  const join = (code) => {
    if (typeof window === "undefined" || !window.Peer) { setPeerError("PeerJS not loaded"); setStatus("error"); return; }
    if (!code || code.length < 4) { setPeerError("Invalid room code"); setStatus("error"); return; }
    cleanup();
    const peer = new window.Peer(undefined, { debug: 0, config: ICE_CONFIG });
    setPeerRef(peer);
    setStatus("joining");
    setRole("guest");
    setRoomCode(code.toUpperCase());
    peer.on("open", () => {
      const conn = peer.connect(MP_PREFIX + code.toUpperCase(), { reliable: true });
      wireConnection(conn);
    });
    peer.on("error", (err) => {
      const msg = String(err && err.message || err);
      let friendly = msg;
      if (msg.indexOf("Could not connect") !== -1 || msg.indexOf("peer-unavailable") !== -1) {
        friendly = "Room not found — check the code.";
      } else if (msg.indexOf("Negotiation") !== -1) {
        friendly = "Connection failed — likely a network/firewall issue. Try a different network or use export/import codes.";
      } else if (msg.indexOf("network") !== -1 || msg.indexOf("Network") !== -1) {
        friendly = "Network error — check your internet connection.";
      } else if (msg.indexOf("server-error") !== -1) {
        friendly = "PeerJS broker is having issues. Try again in a minute.";
      }
      setPeerError(friendly);
      setStatus("error");
    });
  };

  const disconnect = () => {
    cleanup();
    setStatus("idle");
    setRole(null);
    setRoomCode(null);
    setPeerError("");
  };

  const send = (msg) => {
    if (connRef && status === "connected") {
      try { connRef.send(msg); return true; } catch (e) { return false; }
    }
    return false;
  };

  return { status, role, roomCode, peerError, host, join, disconnect, send };
}

/* ═══ DICE ROLLER ═══ */
function DiceRoller({ w, wtype, onClose, cp, setCp, requestDamageApply, applySelfDamage }) {
  const [attackDice, setAttackDice] = useState(null);
  const [defenceDice, setDefenceDice] = useState(null);
  const [rerolledAttack, setRerolledAttack] = useState(false);
  const [cmdRerolled, setCmdRerolled] = useState(false);
  const [defSave, setDefSave] = useState(3);
  const [hasCover, setHasCover] = useState(false);
  const [isObscured, setIsObscured] = useState(false);
  const [editedDamage, setEditedDamage] = useState(null); // user-overridden damage; null = use estimate
  const [hotRoll, setHotRoll] = useState(null); // d6 result if Hot weapon was fired

  // Parse weapon rules
  const wr = w.wr || "";
  const hasLethal5 = wr.includes("Lethal 5+");
  const hasAccurate1 = wr.includes("Accurate 1");
  const hasAccurate2 = wr.includes("Accurate 2");
  const hasBalanced = wr.includes("Balanced");
  const hasCeaseless = wr.includes("Ceaseless");
  const hasRelentless = wr.includes("Relentless");
  const hasSevere = wr.includes("Severe");
  const hasRending = wr.includes("Rending");
  const hasPunishing = wr.includes("Punishing");
  const hasBrutal = wr.includes("Brutal");
  const hasSaturate = wr.includes("Saturate");
  const hasHot = wr.includes("Hot");
  const hasStun = wr.includes("Stun");
  const hasPoison = wr.includes("Poison");
  const hasToxic = wr.includes("Toxic");
  const hasLimited = wr.includes("Limited 1");
  const devastating = wr.includes("Devastating 3") ? 3 : wr.includes("Devastating 2") ? 2 : 0;
  const piercing = wr.includes("Piercing Crits 1") ? "pcrits1" : wr.includes("Piercing 1") ? "p1" : null;
  const hitVal = parseInt(w.hit);
  const critThreshold = hasLethal5 ? 5 : 6;

  const rollD6 = () => Math.floor(Math.random() * 6) + 1;
  const rollMultiple = (n) => Array.from({ length: n }, rollD6);

  const classifyAttack = (val) => {
    if (val === 1) return "fail";
    if (val >= critThreshold) return "crit";
    if (val >= hitVal) return "hit";
    return "fail";
  };

  const doAttackRoll = () => {
    const numDice = parseInt(w.atk);
    const rolls = rollMultiple(numDice);
    setAttackDice(rolls);
    setRerolledAttack(false);
    setCmdRerolled(false);
    setDefenceDice(null);
    setEditedDamage(null);
    setHotRoll(hasHot ? rollD6() : null);
  };

  const rerollAttack = (indices) => {
    if (!attackDice || rerolledAttack) return;
    const newDice = [...attackDice];
    indices.forEach(i => { newDice[i] = rollD6(); });
    setAttackDice(newDice);
    setRerolledAttack(true);
  };

  // Re-roll helpers
  const rerollBalanced = () => {
    if (!attackDice) return;
    const fails = attackDice.map((d, i) => classifyAttack(d) === "fail" ? i : -1).filter(i => i >= 0);
    if (fails.length > 0) rerollAttack([fails[0]]);
    else rerollAttack([0]);
  };
  const rerollCeaseless = () => {
    if (!attackDice) return;
    const counts = {};
    attackDice.forEach((d, i) => { if (!counts[d]) counts[d] = []; counts[d].push(i); });
    let bestTarget = null;
    let bestCount = 0;
    Object.entries(counts).forEach(([val, idxs]) => {
      if (classifyAttack(parseInt(val)) === "fail" && idxs.length > bestCount) { bestTarget = idxs; bestCount = idxs.length; }
    });
    if (bestTarget) rerollAttack(bestTarget);
  };
  const rerollRelentless = () => {
    if (!attackDice) return;
    const fails = attackDice.map((d, i) => classifyAttack(d) === "fail" ? i : -1).filter(i => i >= 0);
    if (fails.length > 0) rerollAttack(fails);
  };

  // Compute attack results
  const getAttackResults = () => {
    if (!attackDice) return null;
    let crits = 0, hits = 0, fails = 0;
    attackDice.forEach(d => { const c = classifyAttack(d); if (c === "crit") crits++; else if (c === "hit") hits++; else fails++; });

    // Accurate: auto successes (already rolled fewer conceptually, but we add hits)
    const accurateBonus = hasAccurate2 ? 2 : hasAccurate1 ? 1 : 0;

    // Severe: no natural crits → upgrade one hit to crit
    let severeApplied = false;
    if (hasSevere && crits === 0 && hits > 0) { crits++; hits--; severeApplied = true; }

    // Rending: any crits → upgrade one hit to crit
    let rendingApplied = false;
    if (hasRending && crits > 0 && hits > 0) { crits++; hits--; rendingApplied = true; }

    // Punishing: any crits → one fail becomes hit
    let punishingApplied = false;
    if (hasPunishing && crits > 0 && fails > 0) { hits++; fails--; punishingApplied = true; }

    hits += accurateBonus;

    // Devastating: each retained crit deals N bonus damage immediately
    const devastatingDmg = devastating * crits;

    return { crits, hits, fails, severeApplied, rendingApplied, punishingApplied, accurateBonus, devastating, devastatingDmg };
  };

  const doDefenceRoll = () => {
    let numDice = 3;
    if (piercing === "p1") numDice = 2;
    const results = getAttackResults();
    if (piercing === "pcrits1" && results && results.crits > 0) numDice = 2;
    const rolls = rollMultiple(numDice);
    setDefenceDice(rolls);
    setEditedDamage(null);
  };

  const classifyDefence = (val) => {
    if (val === 1) return "fail";
    if (val >= 6) return "crit";
    if (val >= defSave) return "hit";
    return "fail";
  };

  const getDefenceResults = () => {
    if (!defenceDice) return null;
    let crits = 0, saves = 0, fails = 0;
    defenceDice.forEach(d => { const c = classifyDefence(d); if (c === "crit") crits++; else if (c === "hit") saves++; else fails++; });
    if (hasCover && !hasSaturate) saves++;
    return { crits, saves, fails, coverSave: hasCover && !hasSaturate };
  };

  const dieColor = (val, classify) => {
    const c = classify(val);
    if (c === "crit") return "#C9772E";
    if (c === "hit") return "#3D6B3F";
    return "#B8341C";
  };

  const DieBox = ({ val, classify, size }) => (
    <div style={{ width: size || 32, height: size || 32, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 3, background: "#0E0F13", border: "2px solid " + dieColor(val, classify), fontSize: size ? size * 0.5 : 16, fontWeight: 700, color: dieColor(val, classify), fontFamily: "'Courier New', monospace", boxShadow: "0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 " + dieColor(val, classify) + "20" }}>{val}</div>
  );

  const atkResults = getAttackResults();
  const defResults = getDefenceResults();

  return (
    <div style={{ background: "#1A1D24", borderRadius: 2, padding: "10px 10px 12px", marginTop: 6, border: "1px solid #C9772E30", boxShadow: "inset 0 2px 8px rgba(0,0,0,0.4)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.08em" }}>DICE ROLLER</div>
        <button onClick={onClose} style={{ ...bs("#9AA5B1"), fontSize: 8, padding: "2px 6px" }}>{"\u2716"} Close</button>
      </div>

      {/* Attack Roll */}
      <div style={{ marginBottom: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
          <button onClick={doAttackRoll} style={{ ...bs("#C9772E"), fontSize: 9, padding: "4px 12px" }}>{"\u2684"} Roll {w.atk} Attack Dice</button>
          <div style={{ fontSize: 8, color: "#9AA5B1" }}>Hit: {w.hit}{hasLethal5 ? " (Lethal 5+)" : ""}</div>
        </div>

        {attackDice && (
          <div>
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
              {attackDice.map((d, i) => (<DieBox key={i} val={d} classify={classifyAttack} />))}
            </div>

            {/* Re-roll buttons */}
            {/* Weapon re-roll buttons (free, from weapon rules) */}
            {!rerolledAttack && (hasBalanced || hasCeaseless || hasRelentless) && (
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 4 }}>
                <span style={{ fontSize: 7, color: "#9AA5B1", alignSelf: "center" }}>FREE:</span>
                {hasBalanced && <button onClick={rerollBalanced} style={{ ...bs("#3D6B3F"), fontSize: 8, padding: "2px 8px" }}>Balanced (re-roll 1)</button>}
                {hasCeaseless && <button onClick={rerollCeaseless} style={{ ...bs("#3D6B3F"), fontSize: 8, padding: "2px 8px" }}>Ceaseless (re-roll same)</button>}
                {hasRelentless && <button onClick={rerollRelentless} style={{ ...bs("#3D6B3F"), fontSize: 8, padding: "2px 8px" }}>Relentless (re-roll all fails)</button>}
              </div>
            )}
            {/* Command Re-roll (1CP, separate from weapon re-rolls) */}
            {!cmdRerolled && (
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
                <span style={{ fontSize: 7, color: "#9AA5B1", alignSelf: "center" }}>1CP:</span>
                <button onClick={() => {
                  if (cp <= 0) return;
                  const fails = attackDice.map((d, i) => classifyAttack(d) === "fail" ? i : -1).filter(i => i >= 0);
                  const target = fails.length > 0 ? [fails[0]] : [0];
                  const newDice = [...attackDice];
                  target.forEach(i => { newDice[i] = rollD6(); });
                  setAttackDice(newDice);
                  setCmdRerolled(true);
                  setCp(cp - 1);
                }} style={{ ...bs(cp > 0 ? "#C9772E" : "#3A4150"), fontSize: 8, padding: "2px 8px", opacity: cp > 0 ? 1 : 0.35, cursor: cp > 0 ? "pointer" : "not-allowed" }}>Cmd Re-roll ({cp}CP left)</button>
              </div>
            )}

            {/* Results summary */}
            {atkResults && (
              <div style={{ background: "#1A1D24", borderRadius: 2, padding: "6px 8px", border: "1px solid #262A33" }}>
                <div style={{ display: "flex", gap: 10, fontSize: 11, fontWeight: 700 }}>
                  <span style={{ color: "#C9772E" }}>{atkResults.crits} Crit{atkResults.crits !== 1 ? "s" : ""}</span>
                  <span style={{ color: "#3D6B3F" }}>{atkResults.hits} Hit{atkResults.hits !== 1 ? "s" : ""}</span>
                  <span style={{ color: "#B8341C" }}>{atkResults.fails} Miss{atkResults.fails !== 1 ? "es" : ""}</span>
                </div>
                <div style={{ fontSize: 9, color: "#9AA5B1", marginTop: 2 }}>
                  Dmg potential: {atkResults.crits}×{w.dmg.split("/")[1]} + {atkResults.hits}×{w.dmg.split("/")[0]}{atkResults.devastatingDmg > 0 ? " + " + atkResults.devastatingDmg + " (Dev)" : ""} = {atkResults.crits * parseInt(w.dmg.split("/")[1]) + atkResults.hits * parseInt(w.dmg.split("/")[0]) + atkResults.devastatingDmg} total
                </div>
                {atkResults.accurateBonus > 0 && <div style={{ fontSize: 8, color: "#3D6B3F" }}>+{atkResults.accurateBonus} auto hit(s) from Accurate</div>}
                {atkResults.severeApplied && <div style={{ fontSize: 8, color: "#C9772E" }}>Severe: upgraded 1 hit → crit (no natural crits)</div>}
                {atkResults.rendingApplied && <div style={{ fontSize: 8, color: "#C9772E" }}>Rending: upgraded 1 hit → crit</div>}
                {atkResults.punishingApplied && <div style={{ fontSize: 8, color: "#C9772E" }}>Punishing: upgraded 1 miss → hit</div>}
                {atkResults.devastatingDmg > 0 && <div style={{ fontSize: 8, color: "#B8341C" }}>Devastating {atkResults.devastating}: {atkResults.crits} crit(s) × {atkResults.devastating} = {atkResults.devastatingDmg} bonus damage (bypasses defence)</div>}
                {hasBrutal && <div style={{ fontSize: 8, color: "#B8341C" }}>Brutal: opponent can only block with crits</div>}
                {hasStun && atkResults.crits > 0 && <div style={{ fontSize: 8, color: "#9B59B6" }}>Stun: target's APL −1 until end of next activation</div>}
                {hasPoison && (atkResults.crits + atkResults.hits) > 0 && <div style={{ fontSize: 8, color: "#7BC242" }}>Poison: if any dmg is dealt, target gains a Poison token (1 dmg at start of each activation)</div>}
                {hasToxic && <div style={{ fontSize: 8, color: "#7BC242" }}>Toxic: +1 / +1 dmg if target already has your Poison token</div>}
                {hasLimited && <div style={{ fontSize: 8, color: "#C9772E" }}>Limited 1: this weapon can only be used once per battle</div>}
              </div>
            )}

            {/* Hot self-damage roll */}
            {hasHot && hotRoll !== null && (() => {
              const hitInt = parseInt(w.hit);
              const triggered = hotRoll < hitInt;
              const selfDmg = triggered ? hotRoll * 2 : 0;
              return (
                <div style={{ marginTop: 6, padding: "6px 8px", background: triggered ? "#B8341C10" : "#3D6B3F10", border: "1px solid " + (triggered ? "#B8341C" : "#3D6B3F") + "40", borderRadius: 2 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ fontSize: 9, color: "#9AA5B1", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>HOT D6:</span>
                      <div style={{ width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 3, background: "#0E0F13", border: "2px solid " + (triggered ? "#B8341C" : "#3D6B3F"), fontSize: 11, fontWeight: 700, color: triggered ? "#B8341C" : "#3D6B3F", fontFamily: "'Courier New', monospace" }}>{hotRoll}</div>
                      <span style={{ fontSize: 8, color: triggered ? "#B8341C" : "#3D6B3F" }}>{triggered ? hotRoll + " < " + w.hit + " → " + selfDmg + " self-damage" : hotRoll + " ≥ " + w.hit + " → safe"}</span>
                    </div>
                    {triggered && (
                      <button disabled={!applySelfDamage} onClick={() => { if (applySelfDamage) applySelfDamage(selfDmg); }} style={{ ...bs("#B8341C"), fontSize: 8, padding: "3px 8px", opacity: applySelfDamage ? 1 : 0.4 }}>{"\u2620"} Apply {selfDmg} self-dmg</button>
                    )}
                  </div>
                </div>
              );
            })()}
          </div>
        )}
      </div>

      {/* Defence Roll */}
      {attackDice && atkResults && (atkResults.crits + atkResults.hits > 0) && (
        <div style={{ borderTop: "1px solid #262A33", paddingTop: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, flexWrap: "wrap" }}>
            <div style={{ fontSize: 9, color: "#9AA5B1", fontFamily: "'Rajdhani', sans-serif" }}>DEFENCE</div>
            <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
              <span style={{ fontSize: 8, color: "#9AA5B1" }}>Save:</span>
              <select value={defSave} onChange={(e) => setDefSave(parseInt(e.target.value))} style={{ background: "#262A33", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 10, padding: "2px 4px" }}>
                {[2,3,4,5,6].map(v => <option key={v} value={v}>{v}+</option>)}
              </select>
            </div>
            <div onClick={() => setHasCover(!hasCover)} style={{ display: "flex", alignItems: "center", gap: 3, cursor: "pointer", fontSize: 8, color: hasCover ? "#3D6B3F" : "#9AA5B1" }}>
              <div style={{ width: 10, height: 10, borderRadius: 2, border: "1px solid " + (hasCover ? "#3D6B3F" : "#3A4150"), background: hasCover ? "#3D6B3F20" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 7, color: "#3D6B3F" }}>{hasCover ? "\u2720" : ""}</div>
              Cover{hasSaturate ? " (Saturated)" : ""}
            </div>
            <div onClick={() => setIsObscured(!isObscured)} style={{ display: "flex", alignItems: "center", gap: 3, cursor: "pointer", fontSize: 8, color: isObscured ? "#6B9BF7" : "#9AA5B1" }}>
              <div style={{ width: 10, height: 10, borderRadius: 2, border: "1px solid " + (isObscured ? "#6B9BF7" : "#3A4150"), background: isObscured ? "#6B9BF720" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 7, color: "#6B9BF7" }}>{isObscured ? "\u2720" : ""}</div>
              Obscured
            </div>
            <button onClick={doDefenceRoll} style={{ ...bs("#6B9BF7"), fontSize: 9, padding: "4px 10px" }}>{"\u2684"} Roll Defence</button>
          </div>

          {isObscured && atkResults && (
            <div style={{ fontSize: 8, color: "#6B9BF7", background: "#6B9BF708", padding: "3px 6px", borderRadius: 2, marginBottom: 4, border: "1px solid #6B9BF715" }}>
              Obscured: discard 1 attacker success, all crits become normals → {Math.max(0, atkResults.crits + atkResults.hits - 1)} normal hit(s)
            </div>
          )}

          {defenceDice && defResults && (
            <div>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
                {defenceDice.map((d, i) => (<DieBox key={i} val={d} classify={classifyDefence} size={28} />))}
                {defResults.coverSave && <div style={{ width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 3, background: "#3D6B3F15", border: "2px dashed #3D6B3F40", fontSize: 8, color: "#3D6B3F", fontWeight: 700 }}>CVR</div>}
              </div>
              <div style={{ background: "#1A1D24", borderRadius: 2, padding: "6px 8px", border: "1px solid #262A33" }}>
                <div style={{ display: "flex", gap: 10, fontSize: 11, fontWeight: 700 }}>
                  <span style={{ color: "#C9772E" }}>{defResults.crits} Crit Save{defResults.crits !== 1 ? "s" : ""}</span>
                  <span style={{ color: "#3D6B3F" }}>{defResults.saves} Save{defResults.saves !== 1 ? "s" : ""}</span>
                  <span style={{ color: "#B8341C" }}>{defResults.fails} Fail{defResults.fails !== 1 ? "s" : ""}</span>
                </div>
              </div>

              {/* Final damage estimate + Apply */}
              {(() => {
                const critDmg = parseInt(w.dmg.split("/")[1]);
                const normalDmg = parseInt(w.dmg.split("/")[0]);
                let aCrits = atkResults.crits;
                let aHits = atkResults.hits;
                let dCrits = defResults.crits;
                let dSaves = defResults.saves;
                // Brutal: in melee, defender can only block with crits
                if (hasBrutal && wtype === "melee") dSaves = 0;
                // Defender crits cancel attacker crits first
                const k1 = Math.min(aCrits, dCrits); aCrits -= k1; dCrits -= k1;
                // Excess defender crits cancel attacker hits
                const k2 = Math.min(aHits, dCrits); aHits -= k2; dCrits -= k2;
                // Pair-block: 2 normal saves cancel 1 attacker crit (if worthwhile)
                if (critDmg > normalDmg && aCrits > 0 && dSaves >= 2) {
                  const pair = Math.min(aCrits, Math.floor(dSaves / 2));
                  aCrits -= pair; dSaves -= pair * 2;
                }
                // Defender normals cancel attacker hits
                const k3 = Math.min(aHits, dSaves); aHits -= k3;
                const estimate = aCrits * critDmg + aHits * normalDmg + atkResults.devastatingDmg;
                const finalDamage = editedDamage !== null ? editedDamage : estimate;
                return (
                  <div style={{ marginTop: 6, padding: "6px 8px", background: "#262A33", borderRadius: 2, border: "1px solid #C9772E30" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <div style={{ fontSize: 9, color: "#9AA5B1", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>FINAL DMG</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <button onClick={() => setEditedDamage(Math.max(0, finalDamage - 1))} style={{ width: 22, height: 22, border: "1px solid #3A4150", borderRadius: 2, background: "#0E0F13", color: "#B8341C", cursor: "pointer", fontSize: 12, fontWeight: 700, padding: 0 }}>{"\u2212"}</button>
                        <input type="number" value={finalDamage} onChange={(e) => { const v = parseInt(e.target.value); setEditedDamage(isNaN(v) ? 0 : Math.max(0, v)); }} style={{ width: 44, textAlign: "center", background: "#0E0F13", border: "1px solid #3A4150", borderRadius: 2, color: "#C9772E", fontSize: 14, fontWeight: 700, fontFamily: "'Courier New', monospace", padding: "2px 4px", outline: "none" }} />
                        <button onClick={() => setEditedDamage(finalDamage + 1)} style={{ width: 22, height: 22, border: "1px solid #3A4150", borderRadius: 2, background: "#0E0F13", color: "#3D6B3F", cursor: "pointer", fontSize: 12, fontWeight: 700, padding: 0 }}>+</button>
                        {editedDamage !== null && editedDamage !== estimate && (
                          <button onClick={() => setEditedDamage(null)} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "2px 4px" }} title={"Reset to estimate (" + estimate + ")"}>{"\u21BA"}</button>
                        )}
                      </div>
                      <button disabled={!requestDamageApply || finalDamage <= 0} onClick={() => { if (requestDamageApply) requestDamageApply(finalDamage); }} style={{ ...bs(finalDamage > 0 ? "#B8341C" : "#3A4150"), fontSize: 9, padding: "4px 10px", opacity: (requestDamageApply && finalDamage > 0) ? 1 : 0.4, cursor: (requestDamageApply && finalDamage > 0) ? "pointer" : "not-allowed" }}>{"\u2620"} Apply {finalDamage} to target</button>
                    </div>
                    <div style={{ fontSize: 8, color: "#9AA5B1", marginTop: 3 }}>
                      Estimate assumes optimal block. Adjust if obscured, normals-block-crits, or other rules change the math.
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══ WEAPON DISPLAY ═══ */
function WeaponBox({ w, tag, wtype, cp, setCp, requestDamageApply, applySelfDamage }) {
  const [rolling, setRolling] = useState(false);
  const typeIcon = wtype === "melee" ? "\u2694" : "\u2316";
  const typeBorderColor = wtype === "melee" ? "#B8341C40" : "#C9772E40";
  return (
    <div style={{ background: "#262A33", borderRadius: 2, padding: "6px 8px", marginBottom: 4, border: "1px solid #262A33", borderLeft: "2px solid " + typeBorderColor }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style={{ fontSize: 10, color: wtype === "melee" ? "#B8341C" : "#C9772E", opacity: 0.7 }}>{typeIcon}</span>
          <span style={{ fontSize: 11, fontWeight: 600, color: "#F1F2F5", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.02em" }}>{w.name}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          {tag && (<span style={{ fontSize: 7, padding: "2px 6px", borderRadius: 2, background: "#C9772E15", color: "#C9772E", border: "1px solid #C9772E30", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>{tag}</span>)}
          <button onClick={(e) => { e.stopPropagation(); setRolling(!rolling); }} style={{ fontSize: 8, padding: "2px 6px", border: "1px solid " + (rolling ? "#C9772E40" : "#3A415080"), borderRadius: 2, background: rolling ? "#C9772E15" : "transparent", color: rolling ? "#C9772E" : "#9AA5B1", cursor: "pointer", fontFamily: "'Rajdhani', sans-serif" }}>{rolling ? "Close" : "\u2684 Roll"}</button>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 2, marginTop: 4, background: "#1A1D24", borderRadius: 2, padding: "4px 6px", border: "1px solid #262A33" }}>
        {[["ATK", w.atk], ["HIT", w.hit], ["DMG", w.dmg]].map(([label, val]) => (
          <div key={label} style={{ textAlign: "center" }}>
            <div style={{ fontSize: 7, color: "#9AA5B1", letterSpacing: "0.1em", fontFamily: "'Rajdhani', sans-serif" }}>{label}</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#C9772E", fontFamily: "'Courier New', monospace" }}>{val}</div>
          </div>
        ))}
      </div>
      {w.wr && w.wr !== "-" && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 2, marginTop: 4 }}>
          {w.wr.split(", ").map((r, i) => (
            <Tip key={i} k={r}><span style={{ ...pl, fontSize: 8 }}>{r}</span></Tip>
          ))}
        </div>
      )}
      {rolling && <DiceRoller w={w} wtype={wtype} onClose={() => setRolling(false)} cp={cp} setCp={setCp} requestDamageApply={requestDamageApply} applySelfDamage={applySelfDamage} />}
    </div>
  );
}

/* ═══ DATACARD ═══ */
function Datacard({ op, fc, equipWeapons, equipEffects, curWounds, onWound, collapsed, onToggle, ignoreInjured, cp, setCp, isActivated, onActivate, requestDamageApply, applySelfDamage }) {
  const allRanged = [...op.ranged.map(w => ({ ...w, type: "ranged" })), ...equipWeapons.filter(w => w.type === "ranged")];
  const allMelee = [...op.melee.map(w => ({ ...w, type: "melee" })), ...equipWeapons.filter(w => w.type === "melee")];

  const maxW = op.wounds;
  const cw = curWounds !== undefined ? curWounds : maxW;
  const rawInjured = cw > 0 && cw < Math.ceil(maxW / 2);
  const injured = rawInjured && !ignoreInjured;
  const incapacitated = cw <= 0;
  const woundPct = maxW > 0 ? (cw / maxW) * 100 : 0;
  const wcStrong = woundPct > 66;
  const wcMid = woundPct > 33 && woundPct <= 66;
  const woundColorTone = incapacitated ? DS.textTertiary : (rawInjured && !ignoreInjured) ? DS.threat : wcStrong ? DS.success : wcMid ? DS.goldSignal : DS.threat;
  const cardOpacity = incapacitated ? 0.45 : 1;
  const moveDisplay = injured ? (parseInt(op.move) - 2) + "\"" : op.move;

  return (
    <div className="datacard-print" style={{ background: DS.bgCard, borderRadius: 6, marginBottom: 12, boxShadow: "0 4px 16px rgba(0,0,0,0.35)", overflow: "hidden", opacity: cardOpacity, position: "relative", display: "flex", fontFamily: DS.fontBody }}>
      {/* Faction color accent stripe */}
      <div style={{ width: 4, background: incapacitated ? DS.textTertiary : fc, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        {incapacitated && !collapsed && (
          <div style={{ position: "absolute", top: 0, left: 4, right: 0, bottom: 0, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 2, pointerEvents: "none" }}>
            <div style={{ fontFamily: DS.fontDisplay, fontSize: 14, fontWeight: 700, color: DS.threat, letterSpacing: "0.18em", textTransform: "uppercase", background: DS.bgBase + "EE", padding: "8px 18px", borderRadius: 4, border: "1px solid " + DS.threat + "60" }}>Incapacitated</div>
          </div>
        )}

        {/* Header — clickable */}
        <div onClick={onToggle} style={{ padding: "14px 16px 12px", cursor: "pointer", userSelect: "none", opacity: isActivated ? 0.55 : 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
              {onActivate && (
                <div onClick={(e) => { e.stopPropagation(); onActivate(); }} style={{ width: 22, height: 22, borderRadius: 4, border: "1.5px solid " + (isActivated ? DS.success : fc + "70"), background: isActivated ? DS.success + "25" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: DS.success, cursor: "pointer", flexShrink: 0 }}>{isActivated ? "\u2714" : ""}</div>
              )}
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontFamily: DS.fontDisplay, fontSize: 18, fontWeight: 600, color: DS.textPrimary, lineHeight: 1.15, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", textDecoration: isActivated ? "line-through" : "none" }}>{op.name}</div>
                <div style={{ fontFamily: DS.fontDisplay, fontSize: 10, fontWeight: 500, color: fc, marginTop: 3, letterSpacing: "0.14em", textTransform: "uppercase", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{op.kw || "OPERATIVE"}</div>
              </div>
              {collapsed && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0, fontFamily: DS.fontDisplay }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: DS.textPrimary }}>{op.apl}</span>
                  <span style={{ fontSize: 13, fontWeight: 600, color: injured ? DS.threat : DS.textPrimary }}>{moveDisplay}</span>
                  <span style={{ fontSize: 13, fontWeight: 600, color: DS.textPrimary }}>{op.save}</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: woundColorTone }}>{cw}/{maxW}</span>
                  {incapacitated && <span style={{ fontSize: 11, color: DS.threat }}>{"\u2620"}</span>}
                </div>
              )}
            </div>
            <span style={{ fontSize: 12, color: DS.textSecondary, marginTop: 3 }}>{collapsed ? "\u25BC" : "\u25B2"}</span>
          </div>
        </div>

        {/* Wound bar — always visible */}
        <div style={{ height: 3, background: DS.bgBase }}>
          <div style={{ height: "100%", width: woundPct + "%", background: woundColorTone, transition: "width 0.3s, background 0.3s" }} />
        </div>

        {/* Expanded content */}
        {!collapsed && (
          <div>
            {/* Bold stat block — 4 up */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", borderTop: "1px solid " + DS.divider, borderBottom: "1px solid " + DS.divider, background: DS.bgCard }}>
              {[
                { label: "APL", val: op.apl, color: DS.textPrimary },
                { label: "MOVE", val: moveDisplay, color: injured ? DS.threat : DS.textPrimary },
                { label: "SAVE", val: op.save, color: DS.textPrimary },
              ].map(s => (
                <div key={s.label} style={{ textAlign: "center", padding: "14px 4px", borderRight: "1px solid " + DS.divider }}>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 26, fontWeight: 700, color: s.color, lineHeight: 1, letterSpacing: "-0.01em" }}>{s.val}</div>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 10, fontWeight: 500, color: DS.textSecondary, marginTop: 6, letterSpacing: "0.14em", textTransform: "uppercase" }}>{s.label}</div>
                </div>
              ))}
              {/* Interactive wounds cell */}
              <div style={{ textAlign: "center", padding: "10px 4px", display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
                  <button onClick={(e) => { e.stopPropagation(); onWound(-1); }} style={{ width: 26, height: 26, border: "1px solid " + DS.divider, borderRadius: 4, background: DS.bgElevated, color: DS.threat, cursor: "pointer", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, lineHeight: 1 }}>{"\u2212"}</button>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 22, fontWeight: 700, color: woundColorTone, lineHeight: 1, minWidth: 50 }}>
                    {cw}<span style={{ fontSize: 13, color: DS.textSecondary, fontWeight: 500 }}>/{maxW}</span>
                  </div>
                  <button onClick={(e) => { e.stopPropagation(); onWound(1); }} style={{ width: 26, height: 26, border: "1px solid " + DS.divider, borderRadius: 4, background: DS.bgElevated, color: DS.success, cursor: "pointer", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, lineHeight: 1 }}>+</button>
                </div>
                <div style={{ fontFamily: DS.fontDisplay, fontSize: 10, fontWeight: 500, color: injured ? DS.threat : (rawInjured && ignoreInjured) ? DS.success : DS.textSecondary, marginTop: 6, letterSpacing: "0.14em", textTransform: "uppercase" }}>{injured ? "Injured" : incapacitated ? "Down" : rawInjured ? "Low" : "Wounds"}</div>
              </div>
            </div>

            {/* Body */}
            <div style={{ padding: "16px 18px 18px" }}>
              {rawInjured && !incapacitated && !ignoreInjured && (
                <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, color: DS.threat, background: DS.threat + "14", padding: "8px 12px", borderRadius: 4, marginBottom: 12, borderLeft: "3px solid " + DS.threat, fontWeight: 500, letterSpacing: "0.06em" }}>
                  {"\u26A0 INJURED \u2014 \u22122\" Move, \u22121 Hit"}
                </div>
              )}
              {rawInjured && !incapacitated && ignoreInjured && (
                <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, color: DS.success, background: DS.success + "14", padding: "8px 12px", borderRadius: 4, marginBottom: 12, borderLeft: "3px solid " + DS.success, fontWeight: 500, letterSpacing: "0.06em" }}>
                  {"\u2720 Below half wounds \u2014 injury penalties IGNORED (equipment)"}
                </div>
              )}

              {allRanged.length > 0 && (
                <div style={{ marginBottom: allMelee.length > 0 || op.abilities.length > 0 || equipEffects.length > 0 ? 14 : 0 }}>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, fontWeight: 600, color: DS.textSecondary, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 8 }}>Ranged</div>
                  {allRanged.map((w, i) => (<WeaponBox key={"r" + i} w={w} tag={w.note || null} wtype="ranged" cp={cp} setCp={setCp} requestDamageApply={requestDamageApply} applySelfDamage={applySelfDamage} />))}
                </div>
              )}
              {allMelee.length > 0 && (
                <div style={{ marginBottom: op.abilities.length > 0 || equipEffects.length > 0 ? 14 : 0 }}>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, fontWeight: 600, color: DS.textSecondary, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 8 }}>Melee</div>
                  {allMelee.map((w, i) => (<WeaponBox key={"m" + i} w={w} tag={w.note || null} wtype="melee" cp={cp} setCp={setCp} requestDamageApply={requestDamageApply} applySelfDamage={applySelfDamage} />))}
                </div>
              )}
              {op.abilities.length > 0 && (
                <div style={{ marginBottom: equipEffects.length > 0 ? 14 : 0 }}>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, fontWeight: 600, color: DS.textSecondary, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 8 }}>Abilities</div>
                  {op.abilities.map((a, i) => (

                  ))}
                </div>
              )}
              {equipEffects.length > 0 && (
                <div>
                  <div style={{ fontFamily: DS.fontDisplay, fontSize: 11, fontWeight: 600, color: DS.rust, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 8 }}>Equipment</div>
                  {equipEffects.map((e, i) => (
                    <div key={i} style={{ fontSize: 12, color: DS.textPrimary, background: DS.rust + "12", padding: "6px 10px", borderRadius: 4, marginBottom: 4, borderLeft: "3px solid " + DS.rust + "70" }}>{e}</div>
                  ))}

        )}
      </div>

  );
}

/* ═══ BUILDER ═══ */
function Builder({ tp, setTp, mp, mpHandlerRef, showMP, setShowMP }) {
  const mobile = useIsMobile();

  const [prevTp, setPrevTp] = useLocalStorage("prevTp", tp);
  // Transient UI state (not persisted)
  const [setupMission, setSetupMission] = useState("");
  const [setupEquip, setSetupEquip] = useState(3);

  const [showScoring, setShowScoring] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [importCode, setImportCode] = useState("");
  const [importError, setImportError] = useState("");
  const [importMode, setImportMode] = useState("opponent");
  const [toast, setToast] = useState("");
  const [damageRequest, setDamageRequest] = useState(null); // { amount: number } | null
  const requestDamageApply = (amount) => {
    if (typeof amount !== "number" || amount < 0) return;
    setDamageRequest({ amount: Math.floor(amount) });
  };
  const [joinCodeInput, setJoinCodeInput] = useState("");
  const [chatHistory, setChatHistory] = useState([]); // {from: 'me'|'them', text, ts}
  const [chatDraft, setChatDraft] = useState("");
  const sendChat = () => {
    const text = chatDraft.trim();
    if (!text || !mp || mp.status !== "connected") return;
    if (mp.send({ type: "chat", text })) {
      setChatHistory(prev => [...prev, { from: "me", text, ts: Date.now() }].slice(-50));
      setChatDraft("");
    }
  };
  const mpSuppressRef = React.useRef(false); // suppress broadcast while applying remote message
  const handleMpMessage = (msg) => {
    if (!msg || typeof msg !== "object") return;
    mpSuppressRef.current = true;
    try {
      if (msg.type === "snapshot" && msg.payload) {
        const p = msg.payload;
        // Peer's "owned" state becomes our opponent state.
        // Always propagate, even if empty — clears stale opponent data and shows correct faction/color from the moment they pick one.
        if (p.fid !== undefined) {
          if (p.fid === null) {
            setOppRoster(null);
          } else {
            const opF = FACTIONS.find(ff => ff.id === p.fid);
            if (opF) setOppRoster({ factionId: p.fid, factionName: opF.name, factionColor: opF.color, operatives: (p.roster || []).map(o => ({ ...o, equipNote: "" })) });
          }
        }
        if (p.wounds) setOppWounds(p.wounds);
        // Shared state: only the host's snapshot seeds shared values for the guest
        if (p.shared) {
          if (p.shared.tp !== undefined) setTp(p.shared.tp);
          if (p.shared.hasInitiative !== undefined) setHasInitiative(!p.shared.hasInitiative); // mirror: their "I have it" means we don't
          if (p.shared.gameConfig && !gameConfig) setGameConfig(p.shared.gameConfig);
        }
        showToast("Opponent connected & synced");
      } else if (msg.type === "ownedDelta" && msg.payload) {
        const p = msg.payload;
        // Always propagate so live edits appear (adding operatives, swapping weapons, removing operatives, faction changes)
        if (p.fid !== undefined) {
          if (p.fid === null) {
            setOppRoster(null);
          } else {
            const opF = FACTIONS.find(ff => ff.id === p.fid);
            if (opF) setOppRoster({ factionId: p.fid, factionName: opF.name, factionColor: opF.color, operatives: (p.roster || []).map(o => ({ ...o, equipNote: "" })) });
          }
        }
        if (p.wounds) setOppWounds(p.wounds);
      } else if (msg.type === "shared" && msg.payload) {
        const p = msg.payload;
        if (p.tp !== undefined) setTp(p.tp);
        if (p.hasInitiative !== undefined) setHasInitiative(!p.hasInitiative);
      } else if (msg.type === "chat" && msg.text) {
        showToast("Opponent: " + msg.text);
        setChatHistory(prev => [...prev, { from: "them", text: String(msg.text).slice(0, 500), ts: Date.now() }].slice(-50));
      } else if (msg.type === "applyRemoteDamage" && typeof msg.opId === "string" && typeof msg.amount === "number") {
        // Opponent shot one of our operatives — apply to our own roster
        const op = roster.find(o => o.id === msg.opId);
        if (op) {
          setOpWounds(op.id, op.wounds, -msg.amount);
          showToast(op.name + " took " + msg.amount + " dmg");
        }
      } else if (msg.type === "applyRemoteHeal" && typeof msg.opId === "string" && typeof msg.amount === "number") {
        const op = roster.find(o => o.id === msg.opId);
        if (op) setOpWounds(op.id, op.wounds, msg.amount);
      }
    } finally {
      // Release on next tick so the state-change useEffect doesn't re-broadcast
      setTimeout(() => { mpSuppressRef.current = false; }, 50);
    }
  };
  // Register our message handler with the App-level multiplayer hook
  useEffect(() => {
    if (mpHandlerRef) mpHandlerRef.current = handleMpMessage;
  });

  // ── Multiplayer broadcasting ── (must be before any early return to satisfy Rules of Hooks)
  // Broadcast our owned state when it changes
  useEffect(() => {
    if (mp.status !== "connected" || mpSuppressRef.current) return;

  }, [fid, roster, wounds, mp.status]);
  // Broadcast shared state when it changes
  useEffect(() => {
    if (mp.status !== "connected" || mpSuppressRef.current) return;

  }, [tp, hasInitiative, mp.status]);
  // On host's first connect, send an initial snapshot including shared seed
  useEffect(() => {
    if (mp.status === "connected" && mp.role === "host") {

    } else if (mp.status === "connected" && mp.role === "guest") {

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mp.status, mp.role]);

  // Config helpers
  const gc = gameConfig || { missionName: "", equipSlots: 3, numTacOps: 3, numTPs: 4, killzone: "open" };
  const killzoneNames = { open: "Open Play", volkus: "Volkus", gallowdark: "Gallowdark", tomb_world: "Tomb World", bheta_decima: "Bheta-Decima" };

  const confirmSetup = () => {

  };

  // TP change: reset ploys, gain CP only on forward advancement
  if (prevTp !== tp) {
    setPrevTp(tp);
    setUsedPloys({});
    setActivated({});
    if (tp > lastCpTp) {
      const cpGain = tp === 1 ? 1 : (hasInitiative ? 1 : 2);
      setCp(prev => prev + cpGain);
      setLastCpTp(tp);

  }

  // Setup screen
  if (!gameConfig) {

      </div>

    return (
      <div style={{ maxWidth: 500, margin: "0 auto", padding: "20px 16px" }}>
        <div style={{ textAlign: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.04em", textShadow: "0 1px 8px rgba(201,168,76,0.2)" }}>Mission Setup</div>
          <p style={{ ...mu, marginTop: 4 }}>Configure game parameters before building your roster.</p>
        </div>

        <div style={{ ...cd, padding: 14 }}>
          <div style={{ ...h3, color: "#C9772E" }}>GAME PARAMETERS</div>
          <div style={dv} />

          <InputRow label="Mission Name">
            <input type="text" value={setupMission} onChange={(e) => setSetupMission(e.target.value)} placeholder="e.g. Loot & Salvage" style={{ background: "#262A33", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 11, padding: "4px 8px", width: mobile ? 140 : 180, fontFamily: "'Segoe UI', sans-serif", outline: "none" }} />
          </InputRow>

          <InputRow label="Equipment Slots">
            <NumPicker value={setupEquip} onChange={setSetupEquip} min={0} max={6} />

              <option value="open">Open Play</option>
              <option value="volkus">Volkus</option>
              <option value="gallowdark">Gallowdark</option>
              <option value="tomb_world">Tomb World</option>

          </InputRow>
        </div>

        <div style={{ ...cd, padding: 12, background: "#262A33", marginTop: 4 }}>
          <div style={{ fontSize: 9, color: "#9AA5B1", lineHeight: 1.5 }}>
            <span style={{ color: "#C9772E", fontWeight: 700 }}>Standard game:</span> 3 equipment slots, 3 Tac Ops, 4 turning points. Adjust for custom missions or narrative play.
          </div>

        <div style={{ display: "flex", gap: 6, marginTop: 10 }}>

          <button onClick={() => { setSetupMission(""); setSetupEquip(3); setSetupTacOps(3); setSetupTPs(4); setSetupKZ("open"); }} style={{ ...bs(changed ? "#C9772E" : "#9AA5B1"), flex: 1, padding: "10px 0", fontSize: 10, background: changed ? "#C9772E12" : "transparent" }}>Reset to Defaults</button>

          <button onClick={confirmSetup} style={{ ...bs("#C9772E"), flex: 2, padding: "10px 0", fontSize: 12, fontWeight: 700, background: "#C9772E12", letterSpacing: "0.08em" }}>
            {"\u2720"} Begin Roster Building {"\u2720"}

        </div>
        {(fid || (roster && roster.length > 0)) && (
          <div style={{ textAlign: "center", marginTop: 14 }}>
            <button onClick={() => {
              if (confirm("Wipe ALL saved data? This will clear your roster, faction, equipment, wounds, CP, VP, and all game state. Cannot be undone.")) {

                if (typeof window !== "undefined") window.location.reload();

              {"\u2716"} Wipe all saved data
            </button>
          </div>
        )}
      </div>

  }
  const f = fid ? FACTIONS[fid] : null;

  const handleInitiativeToggle = () => {

  };
  const isPloyUsed = (type, idx) => usedPloys[type + "-" + idx] || false;

  // Scoring helpers
  const cyclePrimary = (arr, setter, tpIdx) => {
    const newArr = [...arr];
    const oldVal = newArr[tpIdx];
    const newVal = oldVal >= 2 ? 0 : oldVal + 1;
    newArr[tpIdx] = newVal;

  };
  const toggleTacOp = (opIdx, checkIdx) => {

  };
  const setTacOpName = (opIdx, name) => {

  };
  const computedVpYou = primaryYou.reduce((s, v) => s + v, 0) + tacOps.reduce((s, t) => s + t.checks.filter(Boolean).length, 0);
  const computedVpOpp = primaryOpp.reduce((s, v) => s + v, 0);

  const toggleEq = (id) => {

    if (type === "universal") {

      const isUtility = id === "smoke_gren" || id === "stun_gren";
      const hasExistingExplosive = uEq["frag_gren"] || uEq["krak_gren"];
      const hasExistingUtility = uEq["smoke_gren"] || uEq["stun_gren"];

  const selectFaction = (id) => { setFid(id); setRoster([]); setEq({}); setUEq({}); setWounds({}); setCardCollapsed({}); setUsedPloys({}); setCp(2); setVpYou(0); setVpOpp(0); setHasInitiative(true); setLastCpTp(0); setTp(1); setPrimaryYou(Array(gc.numTPs).fill(0)); setPrimaryOpp(Array(gc.numTPs).fill(0)); setTacOps(Array.from({ length: gc.numTacOps }, () => ({ name: "", checks: [false, false] }))); setOppRoster(null); setOppWounds({}); setShowImport(false); setActivated({}); setChapterPrimary(""); setChapterSecondary(""); setChapterVeteran({}); setRosterLocked(false); };

  const collapseAll = () => { const c = {}; roster.forEach(op => { c[op.id] = true; }); setCardCollapsed(c); };
  const expandAll = () => setCardCollapsed({});

  // ── Export/Import ──

  const exportRoster = () => {

    };
    const code = btoa(JSON.stringify(data));

  const importMyRoster = (code) => {
    try {
      const raw = atob(code.trim());
      const data = JSON.parse(raw);
      const faction = FACTIONS[data.f];
      if (!faction) return "Unknown faction: " + data.f;
      const ops = data.o.map(id => faction.operatives.find(x => x.id === id)).filter(Boolean);
      if (ops.length === 0) return "No valid operatives found.";
      setFid(data.f);
      setRoster(ops);
      const newEq = {};
      (data.fe || []).forEach(id => { newEq[id] = true; });
      setEq(newEq);
      const newUEq = {};
      (data.ue || []).forEach(id => { newUEq[id] = true; });
      setUEq(newUEq);
      setWounds({});
      setCardCollapsed({});
      setActivated({});
      showToast("\u2720 Roster imported: " + faction.name + " (" + ops.length + " operatives)");
      return null;
    } catch (e) {
      return "Invalid code.";

  };

  const importOpponent = () => {
    setImportError("");
    try {
      const raw = atob(importCode.trim());

      const faction = FACTIONS[data.f];
      if (!faction) { setImportError("Unknown faction: " + data.f); return; }
      const ops = data.o.map(id => faction.operatives.find(x => x.id === id)).filter(Boolean);
      if (ops.length === 0) { setImportError("No valid operatives found."); return; }
      // Build equipment state for opponent
      const oppEq = {};
      (data.fe || []).forEach(id => { oppEq[id] = true; });
      const oppUEq = {};
      (data.ue || []).forEach(id => { oppUEq[id] = true; });
      // Compute equipment effects per operative
      const getOppEquip = (op) => {
        const weapons = [];
        const effects = [];
        let ignoreInjured = false;
        faction.equipment.forEach(q => {
          if (!oppEq[q.id]) return;
          if (op.ex && op.ex.includes(q.id)) return;
          if (q.ex && q.ex.includes(op.id)) return;
          if (q.gw) weapons.push({ ...q.gw });
          if (q.mod === "ignore_injured") { ignoreInjured = true; effects.push(q.name + ": Ignore injured stat changes."); }
          else if (q.mod === "poison_bolts") {
            if (op.ranged.some(r => r.name.toLowerCase().includes("boltgun") || r.name.toLowerCase().includes("bolt pistol")))
              effects.push("Plague Rounds: Boltgun/bolt pistol gain Poison, Severe");
          } else if (q.mod === "remove_range") {
            if (op.ranged.some(r => r.name.toLowerCase().includes("slugga") || r.name.toLowerCase().includes("shokka")))
              effects.push("Collapsible Stocks: Range removed");
          } else if (!q.gw && !q.mod) effects.push(q.name + ": " + q.desc);
        });
        UNIV_EQUIP.forEach(q => {
          if (!oppUEq[q.id]) return;
          if (q.gw) weapons.push({ ...q.gw });
          if (!q.gw && !q.mod) effects.push(q.name + ": " + q.desc);
        });
        return { weapons, effects, ignoreInjured };
      };
      setOppRoster({ faction, operatives: ops, eq: oppEq, uEq: oppUEq, getEquip: getOppEquip });
      const initCollapsed = {};
      ops.forEach(op => { initCollapsed[op.id] = true; });
      setOppWounds({});
      setOppCollapsed(initCollapsed);
      setShowImport(false);
      setImportCode("");
    } catch (e) {
      setImportError("Invalid code. Check and try again.");
    }

  const getOppWounds = (opId, maxW) => oppWounds[opId] !== undefined ? oppWounds[opId] : maxW;
  const setOppWound = (opId, maxW, delta) => {

  const printRoster = () => {

      });

      }
      html += '</div><div style="font-size:5px;color:#888;margin-top:1px;">TRACK</div></div>';

      // Weapons

          s += '<div style="font-size:8px;font-weight:700;color:#333;white-space:nowrap;">' + w.atk + ' \u2022 ' + w.hit + ' \u2022 ' + w.dmg + '</div></div>';
          if (w.wr && w.wr !== "-") s += '<div style="font-size:6px;color:#777;line-height:1.2;margin-bottom:1px;">' + w.wr + '</div>';
        });
        s += '</div>';
        return s;
      };
      html += weaponSec(allR, "RANGED", "\u2316");
      html += weaponSec(allM, "MELEE", "\u2694");
      // Abilities
      if (op.abilities.length > 0) {
        html += '<div style="padding:2px 6px;border-bottom:1px solid #eee;">';

        op.abilities.forEach(a => {

      // Equipment
      if (result.effects.length > 0) {

        result.effects.forEach(e => {

        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    // Page 2: Reference sheet
    html += '<div style="break-before:page;page-break-before:always;padding-top:8px;">';
    html += '<div style="text-align:center;margin-bottom:8px;border-bottom:2px solid #333;padding-bottom:4px;">';
    html += '<div style="font-size:14px;font-weight:700;color:' + fc + ';">' + fName + ' \u2014 Reference Sheet</div></div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';

    // Faction Rules
    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:' + fc + ';letter-spacing:0.1em;margin-bottom:4px;">FACTION RULES</div>';
    f.factionRules.forEach(r => {
      html += '<div style="margin-bottom:3px;"><div style="font-size:8px;font-weight:700;">' + r.name + '</div>';
      html += '<div style="font-size:7px;color:#444;line-height:1.3;">' + r.desc + '</div></div>';
    });
    html += '</div>';

    // Equipment
    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#B8960C;letter-spacing:0.1em;margin-bottom:4px;">EQUIPMENT SELECTIONS</div>';
    if (activeEq.length > 0) {
      html += '<div style="font-size:7px;font-weight:700;margin-bottom:2px;">Faction:</div>';
      activeEq.forEach(q => { html += '<div style="font-size:7px;color:#444;margin-bottom:2px;">\u2022 ' + q.name + ': ' + q.desc + '</div>'; });
    }
    if (activeUEq.length > 0) {
      html += '<div style="font-size:7px;font-weight:700;margin-top:3px;margin-bottom:2px;">Universal:</div>';
      activeUEq.forEach(q => { html += '<div style="font-size:7px;color:#444;margin-bottom:2px;">\u2022 ' + q.name + ': ' + q.desc + '</div>'; });
    }
    if (activeEq.length === 0 && activeUEq.length === 0) html += '<div style="font-size:7px;color:#888;">None selected</div>';
    html += '</div>';

    // Strategy Ploys
    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#8B7B20;letter-spacing:0.1em;margin-bottom:4px;">STRATEGY PLOYS (1CP)</div>';
    f.ploys.strategy.forEach(p => {
      html += '<div style="margin-bottom:3px;display:flex;gap:4px;align-items:flex-start;">';
      html += '<div style="width:8px;height:8px;border:1px solid #aaa;border-radius:1px;flex-shrink:0;margin-top:1px;"></div>';
      html += '<div><div style="font-size:7px;font-weight:700;">' + p.name + '</div>';
      html += '<div style="font-size:6px;color:#555;line-height:1.3;">' + p.desc + '</div></div></div>';
    });
    html += '</div>';

    // Firefight Ploys
    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#993333;letter-spacing:0.1em;margin-bottom:4px;">FIREFIGHT PLOYS (1CP)</div>';
    f.ploys.firefight.forEach(p => {
      html += '<div style="margin-bottom:3px;display:flex;gap:4px;align-items:flex-start;">';
      html += '<div style="width:8px;height:8px;border:1px solid #aaa;border-radius:1px;flex-shrink:0;margin-top:1px;"></div>';

      html += '<div style="font-size:6px;color:#555;line-height:1.3;">' + p.desc + '</div></div></div>';
    });
    html += '</div>';

    // Quick Reference
    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#333;letter-spacing:0.1em;margin-bottom:4px;">SHOOTING SEQUENCE</div>';
    ["1. Select ranged weapon (ATK dice)", "2. Select valid target (Engage=visible, Conceal=visible+not in cover)", "3. Roll ATK: >= Hit = success, 6 = crit, 1 = fail", "4. If obscured: discard 1 success, crits become normals", "5. Defence: 3D6 >= Save. Cover: +1 auto normal save", "6. Block: norm\u2192norm, crit\u2192any, 2 norms\u2192crit", "7. Unblocked: Normal Dmg / Critical Dmg"].forEach(s => {
      html += '<div style="font-size:6px;color:#444;line-height:1.4;padding-left:2px;">' + s + '</div>';
    });
    html += '</div>';

    html += '<div style="border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#333;letter-spacing:0.1em;margin-bottom:4px;">FIGHTING SEQUENCE</div>';
    ["1. Select enemy in control range (they retaliate)", "2. Both select melee weapon, collect ATK dice", "3. Both roll: >= Hit = success, 6 = crit", "4. Alternate (attacker first): Strike or Block", "   Strike: deal Normal/Critical Dmg immediately", "   Block: cancel 1 opponent success (norm\u2192norm, crit\u2192any)"].forEach(s => {
      html += '<div style="font-size:6px;color:#444;line-height:1.4;padding-left:2px;">' + s + '</div>';
    });
    html += '</div>';

    // Key rules reminder
    html += '<div style="grid-column:span 2;border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';
    html += '<div style="font-size:8px;font-weight:700;color:#333;letter-spacing:0.1em;margin-bottom:4px;">KEY RULES</div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:6px;color:#444;line-height:1.3;">';

    html += '<div><b>Incapacitated:</b> 0 wounds = removed.</div>';

    html += '<div><b>Counteract:</b> All expended? 1 Engaged op: free 1AP (max 2\u2033 move).</div>';

    html += '</div>'; // end grid
    html += '</div>'; // end page 2

    // Scoring tracker
    html += '<div style="margin-top:12px;border:1px solid #ccc;border-radius:4px;padding:6px;break-inside:avoid;">';

    html += '<table style="width:100%;border-collapse:collapse;font-size:7px;">';
    html += '<tr><td style="border:1px solid #ccc;padding:2px 4px;font-weight:700;">TP</td>';
    for (let i = 1; i <= gc.numTPs; i++) html += '<td style="border:1px solid #ccc;padding:2px 8px;text-align:center;font-weight:700;">' + i + '</td>';
    html += '<td style="border:1px solid #ccc;padding:2px 4px;font-weight:700;">TOTAL</td></tr>';

    html += '<td style="border:1px solid #ccc;padding:4px;"></td></tr>';
    html += '<tr><td style="border:1px solid #ccc;padding:4px;">Opp — Primary</td>';

    html += '</tr><tr><td style="border:1px solid #ccc;padding:4px;">CP</td><td style="border:1px solid #ccc;padding:4px;text-align:center;">2</td>';
    for (let i = 0; i < gc.numTPs; i++) html += '<td style="border:1px solid #ccc;padding:4px;"></td>';
    html += '</tr></table></div>';

    html += '</div>'; // end outer

    const pw = window.open('', '_blank');
    pw.document.write('<!DOCTYPE html><html><head><title>' + fName + ' Roster</title>');
    pw.document.write('<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">');
    pw.document.write('<style>@page{margin:0.3in;size:auto;} body{margin:0;} @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style>');
    pw.document.write('</head><body>' + html + '</body></html>');
    pw.document.close();
    setTimeout(() => { pw.print(); }, 500);
  };

  // ── Validation logic ──
  const getValidation = () => {
    if (!f || !f.composition) return { errors: [], warnings: [], valid: true };
    const c = f.composition;
    const errors = [];
    const warnings = [];
    const leaderCount = roster.filter(r => c.leaders.ids.includes(r.id)).length;
    const troopCount = roster.filter(r => c.troops.ids.includes(r.id)).length;

    // Leader count
    if (leaderCount === 0) errors.push("No leader selected \u2014 select exactly " + c.leaders.min + ".");
    else if (leaderCount > c.leaders.max) errors.push("Too many leaders \u2014 maximum " + c.leaders.max + ".");

    // Troop count (accounting for half slots)
    let effectiveTroopSlots = 0;
    roster.forEach(r => {
      if (!c.troops.ids.includes(r.id)) return;
      if (c.halfSlots.includes(r.id)) effectiveTroopSlots += 0.5;
      else effectiveTroopSlots += 1;
    });
    if (effectiveTroopSlots < c.troops.min) {
      const diff = c.troops.min - effectiveTroopSlots;
      warnings.push("Need " + diff + " more operative" + (diff !== 1 ? "s" : "") + " (" + effectiveTroopSlots + "/" + c.troops.min + " slots filled).");
    }
    if (effectiveTroopSlots > c.troops.max) errors.push("Too many operatives \u2014 maximum " + c.troops.max + " slots (half-selections count as 0.5).");

    // Unique constraints
    c.unique.forEach(uid => {
      const count = roster.filter(r => r.id === uid).length;
      if (count > 1) {
        const op = f.operatives.find(o => o.id === uid);
        errors.push((op ? op.name : uid) + " can only be included once.");
      }
    });

    // Total
    if (roster.length > 0 && roster.length < c.total) {
      warnings.push("Roster has " + roster.length + "/" + c.total + " operatives.");
    }
    if (roster.length > c.total) errors.push("Too many operatives \u2014 maximum " + c.total + " total.");

    // Equipment validation
    const factionEqCount = Object.keys(eq).filter(k => eq[k]).length;
    const hasExplosiveGrenades = uEq["frag_gren"] || uEq["krak_gren"];
    const hasUtilityGrenades = uEq["smoke_gren"] || uEq["stun_gren"];
    const otherUnivCount = Object.keys(uEq).filter(k => uEq[k] && !["frag_gren", "krak_gren", "smoke_gren", "stun_gren"].includes(k)).length;
    const univEqSlots = (hasExplosiveGrenades ? 1 : 0) + (hasUtilityGrenades ? 1 : 0) + otherUnivCount;
    const totalEqSlots = factionEqCount + univEqSlots;

    if (totalEqSlots > gc.equipSlots) {
      warnings.push("Equipment: " + totalEqSlots + " selections (limit is " + gc.equipSlots + ").");
    }

    return { errors, warnings, valid: errors.length === 0, equipCount: totalEqSlots };
  };

  // ── Can this operative be added? ──
  const canAdd = (opId, rosterOverride) => {
    if (!validate || !f || !f.composition) return true;
    const r = rosterOverride || roster;
    const c = f.composition;
    const isLeader = c.leaders.ids.includes(opId);
    const isTroop = c.troops.ids.includes(opId);
    const already = r.find(x => x.id === opId);

    // Already in roster? Can always toggle off
    if (already) return true;

    // Total cap
    if (r.length >= c.total) return false;

    // Leader cap
    if (isLeader) {
      const leaderCount = r.filter(x => c.leaders.ids.includes(x.id)).length;
      if (leaderCount >= c.leaders.max) return false;
    }

    // Troop slot cap
    if (isTroop) {
      let usedSlots = 0;
      r.forEach(x => {
        if (!c.troops.ids.includes(x.id)) return;
        usedSlots += c.halfSlots.includes(x.id) ? 0.5 : 1;
      });
      const thisSlotCost = c.halfSlots.includes(opId) ? 0.5 : 1;
      if (usedSlots + thisSlotCost > c.troops.max) return false;
    }

    // Unique check
    if (c.unique.includes(opId) && r.find(x => x.id === opId)) return false;

    return true;
  };

  const toggleOp = (id) => {
    if (rosterLocked) return;
    setRoster(prev => {
      if (prev.find(r => r.id === id)) {
        return prev.filter(r => r.id !== id);
      } else {
        if (validate && !canAdd(id, prev)) return prev;
        const op = f.operatives.find(x => x.id === id);
        if (op) return [...prev, op];
        return prev;
      }
    });
  };

  const getEquipForOp = (op) => {
    if (!f) return { weapons: [], effects: [], ignoreInjured: false };
    const weapons = [];
    const effects = [];
    let ignoreInjured = false;
    // Faction equipment
    f.equipment.forEach(q => {
      if (!eq[q.id]) return;
      if (op.ex && op.ex.includes(q.id)) return;
      if (q.ex && q.ex.includes(op.id)) return;
      if (q.gw) weapons.push({ ...q.gw });
      if (q.mod === "ignore_injured") {
        ignoreInjured = true;
        effects.push(q.name + ": Ignore all stat changes from being injured.");
      }
      else if (q.mod === "poison_bolts") {
        const hasBolt = op.ranged.some(r => r.name.toLowerCase().includes("boltgun") || r.name.toLowerCase().includes("bolt pistol"));
        if (hasBolt) effects.push("Plague Rounds: Boltgun/bolt pistol gain Poison, Severe");
      }
      else if (q.mod === "remove_range") {
        const has = op.ranged.some(r => r.name.toLowerCase().includes("slugga") || r.name.toLowerCase().includes("shokka"));
        if (has) effects.push("Collapsible Stocks: Range removed from Slugga/Shokka");
      }
      else if (!q.gw && !q.mod) effects.push(q.name + ": " + q.desc);
    });
    // Universal equipment
    UNIV_EQUIP.forEach(q => {
      if (!uEq[q.id]) return;
      if (q.gw) weapons.push({ ...q.gw });
      if (!q.gw && !q.mod) effects.push(q.name + ": " + q.desc);
    });
    return { weapons, effects, ignoreInjured };
  };

  const v = f ? getValidation() : { errors: [], warnings: [], valid: true };
  const isComplete = f && f.composition && roster.length === f.composition.total && v.valid;

  return (
    <div style={{ maxWidth: 1200, margin: "0 auto", padding: "20px 16px", position: "relative" }}>

                        showToast(op.name + " took " + damageRequest.amount + " dmg (sent)");

                        setOppWound(op.id, op.wounds, -damageRequest.amount);

        </div>

      {showMP && (

          <div onClick={(e) => e.stopPropagation()} style={{ background: "#1A1D24", border: "1px solid #6B9BF780", borderRadius: 4, padding: 16, maxWidth: 440, width: "100%", boxShadow: "0 8px 40px rgba(0,0,0,0.7)" }}>

                <span style={{ color: "#9AA5B1", letterSpacing: "0.08em" }}>STATUS</span>

                  {mp.status === "idle" && "Disconnected"}
                  {mp.status === "hosting" && "Waiting for opponent..."}
                  {mp.status === "joining" && "Connecting..."}
                  {mp.status === "connected" && "\u25CF Connected as " + mp.role}
                  {mp.status === "error" && "Error"}
                </span>
              </div>
              {mp.roomCode && (
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                  <span style={{ color: "#9AA5B1", letterSpacing: "0.08em" }}>ROOM CODE</span>
                  <span style={{ color: "#C9772E", fontWeight: 700, fontFamily: "monospace", letterSpacing: "0.15em" }}>{mp.roomCode}</span>
                </div>
              )}
              {mp.peerError && <div style={{ marginTop: 4, color: "#B8341C", fontSize: 9 }}>{mp.peerError}</div>}
            </div>

            {mp.status === "idle" || mp.status === "error" ? (
              <div>
                <button onClick={mp.host} style={{ ...bs("#C9772E"), width: "100%", padding: "10px 0", fontSize: 12, fontWeight: 700, background: "#C9772E12", letterSpacing: "0.06em", marginBottom: 10 }}>
                  {"\u2691"} Host New Game
                </button>
                <div style={{ fontSize: 9, color: "#9AA5B1", textAlign: "center", margin: "8px 0", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.1em" }}>{"\u2014"} OR {"\u2014"}</div>

                  <button onClick={() => { mp.join(joinCodeInput); setJoinCodeInput(""); }} disabled={joinCodeInput.length < 4} style={{ ...bs(joinCodeInput.length >= 4 ? "#6B9BF7" : "#3A4150"), padding: "8px 14px", fontSize: 11, fontWeight: 700, background: joinCodeInput.length >= 4 ? "#6B9BF720" : "transparent", opacity: joinCodeInput.length >= 4 ? 1 : 0.5, cursor: joinCodeInput.length >= 4 ? "pointer" : "not-allowed" }}>Join</button>

                <div style={{ fontSize: 9, color: "#9AA5B1", marginTop: 12, lineHeight: 1.5 }}>

                </div>
              </div>
            ) : mp.status === "hosting" ? (
              <div>
                <div style={{ textAlign: "center", padding: "12px 0", marginBottom: 10, background: "#0E0F13", borderRadius: 2, border: "1px dashed #C9772E60" }}>

                  <div style={{ fontSize: 28, fontWeight: 700, color: "#C9772E", fontFamily: "monospace", letterSpacing: "0.3em" }}>{mp.roomCode}</div>

                </div>
                <div style={{ fontSize: 10, color: "#C9772E", textAlign: "center", marginBottom: 10, fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>{"\u25CB"} Waiting for opponent to join...</div>
                <button onClick={mp.disconnect} style={{ ...bs("#B8341C"), width: "100%", padding: "8px 0", fontSize: 10 }}>Cancel</button>
              </div>

              <div>
                <div style={{ textAlign: "center", padding: "12px 0", color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>{"\u25CB"} Connecting to {mp.roomCode}...</div>
                <button onClick={mp.disconnect} style={{ ...bs("#B8341C"), width: "100%", padding: "8px 0", fontSize: 10 }}>Cancel</button>

                        </div>
                      </div>
                    ))}

                  <div style={{ display: "flex", gap: 4 }}>
                    <input type="text" value={chatDraft} onChange={(e) => setChatDraft(e.target.value.slice(0, 500))} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } }} placeholder="Type a message..." style={{ flex: 1, background: "#0E0F13", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 11, padding: "6px 8px", outline: "none" }} />

                  </div>
                </div>

                <button onClick={mp.disconnect} style={{ ...bs("#B8341C"), width: "100%", padding: "8px 0", fontSize: 10 }}>{"\u2716"} Disconnect</button>
              </div>
            ) : null}
          </div>
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.04em", textShadow: "0 1px 8px rgba(201,168,76,0.2)" }}>Army Builder</div>

          {!gc.missionName && gc.killzone !== "open" && <div style={{ fontSize: 9, color: "#9AA5B1", fontFamily: "'Rajdhani', sans-serif" }}>{killzoneNames[gc.killzone]}</div>}
        </div>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          <button onClick={() => setGameConfig(null)} style={{ ...bs("#9AA5B1"), fontSize: 8, padding: "3px 8px" }}>{"\u2190"} Setup</button>
          <button onClick={() => setShowMP(true)} title={mp.status === "connected" ? "Connected: " + mp.roomCode : mp.status === "hosting" ? "Hosting: " + mp.roomCode : "Multiplayer"} style={{ ...bs(mp.status === "connected" ? "#3D6B3F" : mp.status === "hosting" || mp.status === "joining" ? "#C9772E" : mp.status === "error" ? "#B8341C" : "#6B9BF7"), fontSize: 8, padding: "3px 8px", background: mp.status === "connected" ? "#3D6B3F20" : mp.status === "hosting" || mp.status === "joining" ? "#C9772E20" : "transparent" }}>
            {mp.status === "connected" ? "\u25CF MP" : mp.status === "hosting" || mp.status === "joining" ? "\u25CB MP" : "\u2295 MP"}
          </button>
          {f && <button onClick={() => { if (confirm("Reset all game state? Wounds, CP, VP, ploys, and activated will be cleared.")) { setWounds({}); setCp(2); setVpYou(0); setVpOpp(0); setUsedPloys({}); setActivated({}); setHasInitiative(true); setLastCpTp(0); setTp(1); setPrimaryYou(Array(gc.numTPs).fill(0)); setPrimaryOpp(Array(gc.numTPs).fill(0)); setTacOps(Array.from({ length: gc.numTacOps }, () => ({ name: "", checks: [false, false] }))); setOppWounds({}); }}} style={{ ...bs("#B8341C"), fontSize: 8, padding: "3px 8px" }}>{"\u21BA"} Reset</button>}

            <button onClick={() => setValidate(!validate)} style={{ ...bs(validate ? "#3D6B3F" : "#9AA5B1"), fontSize: 9, padding: "4px 10px" }}>

        </div>
      </div>
      <p style={{ ...mu, marginBottom: 12 }}>

          <div key={fc.id} onClick={() => { if (rosterLocked && fid === fc.id) return; if (rosterLocked && fid !== fc.id) { if (!confirm("Roster is locked. Change faction? This will reset everything.")) return; } selectFaction(fc.id); }} style={{ ...cd, cursor: "pointer", borderColor: fid === fc.id ? fc.color : "#3A4150", textAlign: "center", padding: 12, borderTop: fid === fc.id ? "2px solid " + fc.color : "2px solid #3A4150", boxShadow: fid === fc.id ? "0 0 16px " + fc.color + "20, 0 2px 8px rgba(0,0,0,0.4)" : cd.boxShadow }}>

            <div style={{ fontSize: 12, fontWeight: 700, marginTop: 6, fontFamily: "'Rajdhani', sans-serif", color: fid === fc.id ? fc.color : "#F1F2F5", letterSpacing: "0.04em" }}>{fc.name}</div>
          </div>
