      </div>

      {f && (
        <div>
          {/* Game Tracker Bar */}
          <div style={{ ...cd, padding: mobile ? 10 : 14, marginBottom: 10 }}>
            {/* TP + Initiative row */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#FFB627", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.1em" }}>TURNING POINT</div>
                <div style={{ display: "flex", gap: 3 }}>
                  {Array.from({ length: gc.numTPs }, (_, i) => i + 1).map(t => (
                    <div key={t} onClick={() => setTp(t)} style={{ width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", borderRadius: 4, background: tp === t ? "#FFB62720" : "#262A33", border: "2px solid " + (tp === t ? "#FFB627" : "#3A4150"), fontSize: 16, fontWeight: 700, color: tp === t ? "#FFB627" : "#9AA5B1", fontFamily: "'Rajdhani', sans-serif" }}>{t}</div>
                  ))}
                </div>
              </div>
              <div onClick={handleInitiativeToggle} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", padding: "6px 12px", borderRadius: 4, background: hasInitiative ? "#C9772E10" : "#6B9BF710", border: "1px solid " + (hasInitiative ? "#C9772E30" : "#6B9BF730") }}>
                <div style={{ width: 10, height: 10, borderRadius: "50%", background: hasInitiative ? "#C9772E" : "#6B9BF7" }} />
                <div style={{ fontSize: 10, fontWeight: 700, color: hasInitiative ? "#C9772E" : "#6B9BF7", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.04em" }}>{hasInitiative ? "YOU HAVE INITIATIVE" : "OPPONENT HAS INITIATIVE"}</div>
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
              {/* CP */}
              <div style={{ background: "#262A33", borderRadius: 4, padding: "10px 8px", border: "1px solid #FFB62725", textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#FFB627", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.12em", marginBottom: 4 }}>COMMAND POINTS</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                  <button onClick={() => setCp(Math.max(0, cp - 1))} style={{ width: 26, height: 26, border: "1px solid #3A4150", borderRadius: 4, background: "#1A1D24", color: "#B8341C", cursor: "pointer", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>{"\u2212"}</button>
                  <div style={{ fontSize: 28, fontWeight: 700, color: cp > 0 ? "#FFB627" : "#B8341C", fontFamily: "'Rajdhani', sans-serif", minWidth: 32, textShadow: cp > 0 ? "0 0 12px rgba(255,182,39,0.4)" : "none" }}>{cp}</div>

                </div>
                <div style={{ fontSize: 9, color: "#9AA5B1", marginTop: 4 }}>{Object.values(usedPloys).filter(Boolean).length > 0 ? Object.values(usedPloys).filter(Boolean).length + " ploy(s) spent" : hasInitiative ? "+1CP next TP" : "+2CP next TP"}</div>
              </div>

              {/* VP You */}
              <div style={{ background: "#262A33", borderRadius: 4, padding: "10px 8px", border: "1px solid #3D6B3F30", textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#3D6B3F", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.12em", marginBottom: 4 }}>YOUR VP</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                  <button onClick={() => setVpYou(Math.max(0, vpYou - 1))} style={{ width: 26, height: 26, border: "1px solid #3A4150", borderRadius: 4, background: "#1A1D24", color: "#B8341C", cursor: "pointer", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>{"\u2212"}</button>
                  <div style={{ fontSize: 28, fontWeight: 700, color: "#3D6B3F", fontFamily: "'Rajdhani', sans-serif", minWidth: 32, textShadow: "0 0 12px rgba(74,140,42,0.3)" }}>{vpYou + computedVpYou}</div>
                  <button onClick={() => setVpYou(vpYou + 1)} style={{ width: 26, height: 26, border: "1px solid #3A4150", borderRadius: 4, background: "#1A1D24", color: "#3D6B3F", cursor: "pointer", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>+</button>
                </div>
              </div>

              {/* VP Opponent */}
              <div style={{ background: "#262A33", borderRadius: 4, padding: "10px 8px", border: "1px solid #B8341C30", textAlign: "center" }}>

                      </div>

                );

            </div>

            {/* Faction Rules */}
            <div style={{ ...cd, padding: 10 }}>
              <div style={{ ...h3, color: f.color }}>FACTION RULES</div>
              <div style={dv} />
              {f.factionRules.map((r, i) => (
                <div key={i} style={{ marginBottom: 6 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif" }}>{r.name}</div>
                  <div style={{ fontSize: 9, color: "#8494A4", lineHeight: 1.4 }}>{r.desc}</div>
                </div>
              ))}
              {/* Chapter Tactics selector (Angels of Death only) */}
              {fid === "angels" && (() => {
                const tactics = [
                  { id: "aggressive", name: "Aggressive", desc: "Melee weapons gain Rending" },
                  { id: "dueller", name: "Dueller", desc: "Normal successes can block crits in melee" },
                  { id: "resolute", name: "Resolute", desc: "Ignore APL mods and Shock" },
                  { id: "stealthy", name: "Stealthy", desc: "+1 auto save when in cover" },
                  { id: "mobile", name: "Mobile", desc: "Fall Back costs -1AP; can Charge from Control Range" },
                  { id: "hardy", name: "Hardy", desc: "5+ crit defence save (extra save on 5+)" },
                  { id: "sharpshooter", name: "Sharpshooter", desc: "Stationary bolt weapons: Accurate 1, Severe" },
                  { id: "siege", name: "Siege Specialist", desc: "Ranged weapons gain Saturate" },
                ];
                const veteranOps = roster.filter(r => r.abilities && r.abilities.some(a => a.includes("Chapter Veteran")));
                return (
                  <div style={{ marginTop: 8, padding: 8, background: "#262A33", borderRadius: 4, border: "1px solid #262A33" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: f.color, fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.08em", marginBottom: 6 }}>CHAPTER TACTICS</div>
                    <div style={{ fontSize: 9, color: "#9AA5B1", marginBottom: 6 }}>Choose a primary and secondary tactic for your kill team.</div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 6 }}>
                      <div style={{ flex: 1, minWidth: 120 }}>

                        <select value={chapterPrimary} onChange={(e) => setChapterPrimary(e.target.value)} style={{ width: "100%", background: "#0E0F13", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 10, padding: "4px 6px", outline: "none" }}>
                          <option value="">Select...</option>
                          {tactics.filter(t => t.id !== chapterSecondary).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        {chapterPrimary && <div style={{ fontSize: 8, color: "#9AA5B1", marginTop: 2 }}>{tactics.find(t => t.id === chapterPrimary)?.desc}</div>}
                      </div>
                      <div style={{ flex: 1, minWidth: 120 }}>
                        <div style={{ fontSize: 8, fontWeight: 700, color: "#C9772E", marginBottom: 3 }}>SECONDARY</div>
                        <select value={chapterSecondary} onChange={(e) => setChapterSecondary(e.target.value)} style={{ width: "100%", background: "#0E0F13", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 10, padding: "4px 6px", outline: "none" }}>
                          <option value="">Select...</option>
                          {tactics.filter(t => t.id !== chapterPrimary).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>

                      </div>
                    </div>
                    {veteranOps.length > 0 && (
                      <div style={{ marginTop: 6, padding: "6px 8px", background: "#0E0F13", borderRadius: 2, border: "1px solid " + f.color + "30" }}>
                        <div style={{ fontSize: 9, fontWeight: 700, color: f.color, marginBottom: 4 }}>CHAPTER VETERAN (+1 TACTIC)</div>
                        <div style={{ fontSize: 8, color: "#9AA5B1", marginBottom: 4 }}>These operatives gain one additional Chapter Tactic:</div>

                              <option value="">Select +1 tactic...</option>
                              {tactics.filter(t => t.id !== chapterPrimary && t.id !== chapterSecondary).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                            </select>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>

          </div>

          {/* RIGHT PANEL */}
          <div style={{ flex: 1, minWidth: mobile ? "100%" : 320, display: mobile && mobilePanel !== "cards" ? "none" : "block" }}>
            {roster.length === 0 ? (

                <div style={{ position: "sticky", top: 42, zIndex: 8, background: "#0E0F13", paddingBottom: 6 }}>

                        </div>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: mobile ? 6 : 3, alignItems: "center" }}>
                      {(() => {
                        const allCollapsed = roster.length > 0 && roster.every(op => cardCollapsed[op.id]);
                        return <button onClick={allCollapsed ? expandAll : collapseAll} title={allCollapsed ? "Expand all" : "Collapse all"} style={{ ...bs("#9AA5B1"), fontSize: 9, padding: mobile ? "6px 8px" : "2px 5px" }}>{allCollapsed ? "\u25BC" : "\u25B2"}</button>;
                      })()}
                      <button onClick={exportRoster} title="Share roster code" style={{ ...bs("#C9772E"), fontSize: 9, padding: mobile ? "6px 8px" : "2px 5px" }}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: "block" }}><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7" /><polyline points="16 6 12 2 8 6" /><line x1="12" y1="2" x2="12" y2="15" /></svg>
                      </button>
                      <button onClick={printRoster} className="no-print" title="Print roster" style={{ ...bs("#9AA5B1"), fontSize: 9, padding: mobile ? "6px 8px" : "2px 5px" }}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: "block" }}><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
                      </button>
                      {!mobile && !oppRoster && <button onClick={() => setShowImport(true)} title="Import opponent" style={{ ...bs("#6B9BF7"), fontSize: 8, padding: "2px 5px" }}>{"\u21E9"}</button>}
                      {isComplete && (<div style={{ fontSize: 10, color: "#3D6B3F", fontWeight: 700 }}>{"\u2720"}</div>)}
                    </div>
                  </div>
                </div>
                {/* Desktop import dialog */}
                {!mobile && showImport && !oppRoster && (
                  <div style={{ ...cd, padding: 12, marginBottom: 8, borderColor: "#6B9BF730" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                      <div style={{ display: "flex", gap: 4 }}>
                        {[["opponent", "\u2620 Opponent"], ["mine", "\u2692 My Roster"]].map(([mode, label]) => (
                          <button key={mode} onClick={() => setImportMode(mode)} style={{ ...bs(importMode === mode ? (mode === "opponent" ? "#B8341C" : "#C9772E") : "#9AA5B1"), fontSize: 8, padding: "3px 8px", background: importMode === mode ? (mode === "opponent" ? "#B8341C15" : "#C9772E15") : "transparent" }}>{label}</button>

                      </div>
                      <button onClick={() => setShowImport(false)} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "2px 5px" }}>{"\u2716"}</button>
                    </div>
                    <div style={{ fontSize: 9, color: "#9AA5B1", marginBottom: 6 }}>{importMode === "opponent" ? "Paste opponent's roster code:" : "Paste a roster code to load as your team:"}</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input type="text" value={importCode} onChange={(e) => setImportCode(e.target.value)} placeholder="Paste roster code here..." style={{ flex: 1, background: "#262A33", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 11, padding: "6px 8px", fontFamily: "'Segoe UI', sans-serif", outline: "none" }} />
                      <button onClick={() => {
                        if (importMode === "mine") {
                          const err = importMyRoster(importCode);
                          if (err) setImportError(err);
                          else { setShowImport(false); setImportCode(""); setImportError(""); }
                        } else {
                          importOpponent();
                        }
                      }} style={{ ...bs(importMode === "opponent" ? "#B8341C" : "#C9772E"), fontSize: 9, padding: "6px 12px" }}>Import</button>
                    </div>
                    {importError && <div style={{ fontSize: 9, color: "#B8341C", marginTop: 4 }}>{"\u2716"} {importError}</div>}
                  </div>
                )}
                {[...roster].sort((a, b) => {
                  const aAlive = getWounds(a.id, a.wounds) > 0 ? 0 : 1;
                  const bAlive = getWounds(b.id, b.wounds) > 0 ? 0 : 1;
                  return aAlive - bAlive;
                }).map(op => {
                  const result = getEquipForOp(op);
                  return (<Datacard key={op.id} op={op} fc={f.color} equipWeapons={result.weapons} equipEffects={result.effects} curWounds={getWounds(op.id, op.wounds)} onWound={(delta) => setOpWounds(op.id, op.wounds, delta)} collapsed={cardCollapsed[op.id] || false} onToggle={() => toggleCardCollapse(op.id)} ignoreInjured={result.ignoreInjured} cp={cp} setCp={setCp} isActivated={activated[op.id] || false} onActivate={() => setActivated(prev => ({ ...prev, [op.id]: !prev[op.id] }))} requestDamageApply={requestDamageApply} applySelfDamage={(amount) => { setOpWounds(op.id, op.wounds, -amount); showToast(op.name + " took " + amount + " self-dmg"); }} />);

              </div>

          {/* OPPONENT PANEL — third column on desktop, below on mobile */}
          {!mobile && roster.length > 0 && (
            <div style={{ width: oppRoster ? 320 : 0, flexShrink: 0, transition: "width 0.3s", overflow: "hidden" }}>
              {oppRoster ? (
                <div style={{ width: 320 }}>
                  <div style={{ position: "sticky", top: 50, maxHeight: "calc(100vh - 60px)", overflowY: "auto", overflowX: "hidden" }}>
                    <div style={{ background: "linear-gradient(135deg, " + "#B8341C" + "18, #1A1D24)", border: "1px solid " + "#B8341C" + "35", borderRadius: 4, padding: "8px 12px", marginBottom: 6, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: "#B8341C", fontFamily: "'Rajdhani', sans-serif" }}>{oppRoster.faction.name}</div>
                        <div style={{ fontSize: 9, color: "#9AA5B1" }}>{oppRoster.operatives.reduce((s, o) => s + getOppWounds(o.id, o.wounds), 0)}W alive {"\u2022"} {oppRoster.operatives.filter(o => getOppWounds(o.id, o.wounds) <= 0).length} dead</div>
                      </div>
                      <div style={{ display: "flex", gap: 4 }}>
                        {(() => {
                          const allOppCollapsed = oppRoster.operatives.every(op => oppCollapsed[op.id]);
                          return <button onClick={() => { if (allOppCollapsed) setOppCollapsed({}); else { const c = {}; oppRoster.operatives.forEach(op => { c[op.id] = true; }); setOppCollapsed(c); } }} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "2px 5px" }}>{allOppCollapsed ? "\u25BC" : "\u25B2"}</button>;
                        })()}
                        <button onClick={() => setOppWounds({})} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "2px 5px" }}>{"\u2764"}</button>
                        <button onClick={() => { setOppRoster(null); setShowImport(false); }} style={{ ...bs("#B8341C"), fontSize: 7, padding: "2px 5px" }}>{"\u2716"}</button>
                      </div>
                    </div>
                    {oppRoster.operatives.map(op => {
                      const result = oppRoster.getEquip(op);
                      const oCollapsed = oppCollapsed[op.id] || false;
                      return (<Datacard key={"opp-" + op.id} op={op} fc={oppRoster.factionColor || "#9AA5B1"} equipWeapons={result.weapons} equipEffects={result.effects} curWounds={getOppWounds(op.id, op.wounds)} onWound={(delta) => { if (mp && mp.status === "connected" && delta < 0) { mp.send({ type: "applyRemoteDamage", opId: op.id, amount: -delta }); } else if (mp && mp.status === "connected" && delta > 0) { mp.send({ type: "applyRemoteHeal", opId: op.id, amount: delta }); } else { setOppWound(op.id, op.wounds, delta); } }} collapsed={oCollapsed} onToggle={() => setOppCollapsed(prev => ({ ...prev, [op.id]: !oCollapsed }))} ignoreInjured={result.ignoreInjured} cp={0} setCp={() => {}} requestDamageApply={requestDamageApply} applySelfDamage={(amount) => { if (mp && mp.status === "connected") { mp.send({ type: "applyRemoteDamage", opId: op.id, amount }); showToast(op.name + " took " + amount + " self-dmg (sent)"); } else { setOppWound(op.id, op.wounds, -amount); showToast(op.name + " took " + amount + " self-dmg"); } }} />);
                    })}
                  </div>
                </div>
              ) : null}
            </div>
          )}

          {/* Mobile: import + opponent below datacards */}
          {mobile && roster.length > 0 && mobilePanel === "cards" && (
            <div style={{ width: "100%" }}>
                {/* Import Opponent */}
                <div style={{ marginTop: 12 }}>
                  <div onClick={() => setShowImport(!showImport)} style={{ ...cd, padding: "8px 12px", cursor: "pointer", borderColor: oppRoster ? "#B8341C40" : showImport ? "#6B9BF740" : "#3A4150", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: oppRoster ? "#B8341C" : "#6B9BF7", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.08em" }}>
                      {oppRoster ? "\u2620 OPPONENT: " + oppRoster.faction.name + " (" + oppRoster.operatives.length + ")" : "\u21E9 IMPORT ROSTER"}
                    </div>
                    <span style={{ fontSize: 10, color: "#9AA5B1" }}>{showImport ? "\u25B2" : "\u25BC"}</span>
                  </div>

                  {showImport && !oppRoster && (
                    <div style={{ ...cd, padding: 12, borderColor: "#6B9BF730" }}>
                      <div style={{ display: "flex", gap: 4, marginBottom: 6 }}>
                        {[["opponent", "\u2620 Opponent"], ["mine", "\u2692 My Roster"]].map(([mode, label]) => (
                          <button key={mode} onClick={() => setImportMode(mode)} style={{ ...bs(importMode === mode ? (mode === "opponent" ? "#B8341C" : "#C9772E") : "#9AA5B1"), fontSize: 9, padding: "4px 10px", flex: 1, background: importMode === mode ? (mode === "opponent" ? "#B8341C15" : "#C9772E15") : "transparent" }}>{label}</button>
                        ))}
                      </div>
                      <div style={{ fontSize: 9, color: "#9AA5B1", marginBottom: 6 }}>{importMode === "opponent" ? "Paste opponent's roster code:" : "Paste a roster code to load as your team:"}</div>
                      <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                        <input type="text" value={importCode} onChange={(e) => setImportCode(e.target.value)} placeholder="Paste roster code here..." style={{ flex: 1, background: "#262A33", border: "1px solid #3A4150", borderRadius: 2, color: "#F1F2F5", fontSize: 11, padding: "6px 8px", fontFamily: "'Segoe UI', sans-serif", outline: "none" }} />
                        <button onClick={() => {
                          if (importMode === "mine") {
                            const err = importMyRoster(importCode);
                            if (err) setImportError(err);
                            else { setShowImport(false); setImportCode(""); setImportError(""); }
                          } else {
                            importOpponent();
                          }
                        }} style={{ ...bs(importMode === "opponent" ? "#B8341C" : "#C9772E"), fontSize: 9, padding: "6px 12px" }}>Import</button>
                      </div>
                      {importError && <div style={{ fontSize: 9, color: "#B8341C" }}>{"\u2716"} {importError}</div>}
                    </div>
                  )}

                  {oppRoster && showImport && (
                    <div style={{ marginTop: 6 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <div style={{ fontSize: 10, color: "#9AA5B1" }}>
                          {oppRoster.operatives.reduce((s, o) => s + getOppWounds(o.id, o.wounds), 0)}W alive {"\u2022"} {oppRoster.operatives.filter(o => getOppWounds(o.id, o.wounds) <= 0).length} dead
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          {(() => {
                            const allOppCollapsed = oppRoster.operatives.length > 0 && oppRoster.operatives.every(op => oppCollapsed[op.id]);
                            return <button onClick={() => { if (allOppCollapsed) setOppCollapsed({}); else { const c = {}; oppRoster.operatives.forEach(op => { c[op.id] = true; }); setOppCollapsed(c); } }} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "6px 8px" }}>{allOppCollapsed ? "\u25BC" : "\u25B2"}</button>;
                          })()}
                          <button onClick={() => setOppWounds({})} style={{ ...bs("#9AA5B1"), fontSize: 7, padding: "6px 8px" }}>{"\u2764"}</button>
                          <button onClick={() => { setOppRoster(null); setShowImport(false); }} style={{ ...bs("#B8341C"), fontSize: 7, padding: "6px 8px" }}>{"\u2716"}</button>
                        </div>
                      </div>
                      {oppRoster.operatives.map(op => {
                        const result = oppRoster.getEquip(op);
                        const oCollapsed = oppCollapsed[op.id] || false;
                        return (<Datacard key={"opp-m-" + op.id} op={op} fc={oppRoster.factionColor || "#9AA5B1"} equipWeapons={result.weapons} equipEffects={result.effects} curWounds={getOppWounds(op.id, op.wounds)} onWound={(delta) => { if (mp && mp.status === "connected" && delta < 0) { mp.send({ type: "applyRemoteDamage", opId: op.id, amount: -delta }); } else if (mp && mp.status === "connected" && delta > 0) { mp.send({ type: "applyRemoteHeal", opId: op.id, amount: delta }); } else { setOppWound(op.id, op.wounds, delta); } }} collapsed={oCollapsed} onToggle={() => setOppCollapsed(prev => ({ ...prev, [op.id]: !oCollapsed }))} ignoreInjured={result.ignoreInjured} cp={0} setCp={() => {}} requestDamageApply={requestDamageApply} applySelfDamage={(amount) => { if (mp && mp.status === "connected") { mp.send({ type: "applyRemoteDamage", opId: op.id, amount }); showToast(op.name + " took " + amount + " self-dmg (sent)"); } else { setOppWound(op.id, op.wounds, -amount); showToast(op.name + " took " + amount + " self-dmg"); } }} />);
                      })}
                    </div>
                  )}
                </div>
            </div>
          )}
        </div>
        </div>
      )}
    </div>
  );
}

/* ═══ TERRAIN TYPES ═══ */
const TERRAIN_TYPES = [
  { name: "Heavy", color: "#B8341C", desc: "Larger terrain features. Can obscure operatives — if Heavy terrain is intervening between shooter and target (and more than 1\" from both), the target is obscured.", rules: ["Attacker must discard one success when target is obscured.", "All attacker crits become normal successes when target is obscured.", "Cannot obscure if within 1\" of either operative."] },
  { name: "Light", color: "#C9772E", desc: "Smaller terrain features. No additional rules on its own, but other rules interact with it differently. Vantage terrain is also Light terrain.", rules: ["Provides cover but does not obscure.", "Operatives on Vantage can ignore Light terrain for targeting Concealed enemies below them."] },
  { name: "Blocking", color: "#9AA5B1", desc: "Usually gaps between or underneath terrain. Visibility cannot be drawn through Blocking terrain. For cover and obscured purposes, gaps count as intervening like the terrain around them.", rules: ["Visibility cannot pass through.", "Treated as intervening for cover/obscured.", "Rare — exists for necessary gap-blocking."] },
  { name: "Vantage", color: "#6B9BF7", desc: "Upper levels operatives can stand on. Also counts as Light terrain. Provides shooting bonuses and targeting advantages against lower operatives.", rules: ["Shooting target 2\"+ lower with Engage: weapon gains Accurate 1. 4\"+ lower: Accurate 2.", "Targeting Concealed operatives 2\"+ lower: they can't use Light terrain for cover (but keep cover save as crit or get +1 save).", "For obscured, ignore Heavy terrain connected to Vantage the shooter or target is on.", "Operatives can jump from Vantage terrain higher than 2\"."] },
  { name: "Accessible", color: "#3D6B3F", desc: "Operatives can move through this terrain (e.g. doors, open hatches), but it costs an additional 1\" to do so. Only the centre of the base needs to pass through.", rules: ["Move through costs +1\" extra.", "Base centre determines passage, not full base.", "Takes precedence over normal terrain blocking."] },
  { name: "Insignificant", color: "#D5D6D7", desc: "Very small terrain. Ignored for climbing and dropping purposes. Operatives can move over it without going up and down.", rules: ["Ignore for climbing/dropping.", "Move over freely."] },
  { name: "Exposed", color: "#B8341C", desc: "Terrain with large gaps or too small to hide behind. Never counts as intervening for cover or obscured purposes.", rules: ["Never provides cover.", "Never obscures.", "Common on fire steps, barricade feet, open hatchways."] },
  { name: "Ceiling", color: "#9B59B6", desc: "Operatives with 50mm round bases or 60x35mm oval bases can move underneath regardless of model height. Must finish in a placeable location.", rules: ["Allows movement underneath for smaller-based operatives.", "Must still end action in valid position."] },
];

/* ═══ MOVEMENT RULES ═══ */
const MOVEMENT_RULES = [
  { name: "Increments", desc: "All movement is done in straight-line increments, not curves. Each increment is rounded up to the nearest inch. For example, a 0.5\" increment counts as 1\"." },
  { name: "Climbing", desc: "Must be within 1\" horizontally and 3\" vertically of visible terrain to climb it. Each climb is treated as a minimum of 2\" vertically (a 1\" climb costs 2\"). Must finish in a placeable location — can't stop midway." },
  { name: "Dropping", desc: "When moving off terrain or after jumping. Ignore 2\" of vertical drop distance per action (total, not per drop). A drop of 2\" or less is free. Multiple drops in one action share the 2\" allowance." },
  { name: "Jumping", desc: "From Vantage terrain higher than 2\": move up to 4\" horizontally from the edge in one straight-line increment, then drop or climb from there. Can cross gaps up to 4\" wide. If there's a rampart at the edge, climb over it first, then jump from the highest point. When landing, ignore 1\" or less height difference including ramparts." },
  { name: "Through Friendlies", desc: "Friendly operatives can move through other friendly operatives (base and miniature), but not through enemy operatives." },
  { name: "Terrain Blocking", desc: "Bases cannot move through terrain — operatives must move around, climb over, or drop/jump off. Bases cannot extend over the killzone edge." },
];

/* ═══ VISIBILITY & OBSCURED ═══ */
const VISIBILITY_RULES = [
  { name: "Visible", desc: "Look from behind the operative. Draw an unobstructed straight line (1mm diameter) from its head to any part of the target (ignore bases). If you can, the target is visible. An operative is always visible to itself." },
  { name: "Intervening", desc: "If terrain is between the operative and target, it's intervening. When unclear, use targeting lines — imaginary 1mm lines from any point of the operative's base to every facing part of the target's base. Anything at least one line crosses is intervening. Anything all lines cross is wholly intervening." },
  { name: "Cover", desc: "An operative is in cover if there's intervening terrain within its control range (visible and within 1\"). Cannot be in cover while within 2\" of the other operative. An operative cannot be in cover from and obscured by the same terrain feature — defender must choose one. Cover with Conceal = not a valid target. Cover with Engage = cover save (auto normal defence success)." },
  { name: "Obscured", desc: "An operative is obscured if there's intervening Heavy terrain between it and the shooter. Cannot be obscured by Heavy terrain within 1\" of either operative. When shooting an obscured target: (1) discard one success of your choice, (2) all crits become normal successes and can't be changed back. This takes precedence over all other rules." },
  { name: "Cover vs Obscured", desc: "Cover protects Concealed operatives from being targeted and grants a free defence die for Engaged ones. Obscured makes attacks less effective by removing a success and downgrading crits. They're different — cover is about the target's position near terrain, obscured is about Heavy terrain between shooter and target." },
];

  { name: "Razor Wire", type: "terrain", desc: "Exposed and Obstructing terrain. Set up wholly within your territory, on killzone floor, >2\" from other equipment terrain, access points, and Accessible terrain. Whenever an operative crosses within 1\" of it, treat the distance as an additional 1\"." },
  { name: "Mines", type: "terrain", desc: "Set up marker wholly within your territory, >2\" from other markers, access points, and Accessible terrain. The first time the marker is within an operative's control range, remove it and inflict D3+3 damage on that operative." },

/* ═══ RULES ═══ */
function Rules() {
  const [sec, setSec] = useState("core");
  const [exp, setExp] = useState(null);
  const tabs = [["core", "Core"], ["actions", "Actions"], ["terrain", "Terrain"], ["movement", "Movement"], ["visibility", "Visibility"], ["weapons", "Weapon Rules"], ["shooting", "Shooting"], ["fighting", "Fighting"], ["equipment", "Equipment"], ["glossary", "Glossary"]];

  const RuleCard = ({ title, color, children }) => (
    <div style={{ ...cd, padding: 12 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: color || "#C9772E", marginBottom: 4 }}>{title}</div>
      {children}
    </div>
  );

  const StepList = ({ items, color }) => items.map((s, i) => (
    <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
      <div style={{ width: 18, height: 18, borderRadius: "50%", background: (color || "#B8341C") + "20", color: color || "#B8341C", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</div>
      <div style={mu}>{s}</div>
    </div>
  ));

  return (
    <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px 16px" }}>
      <div style={{ fontSize: 22, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", marginBottom: 4, letterSpacing: "0.04em", textShadow: "0 1px 8px rgba(201,168,76,0.2)" }}>Rules Reference</div>
      <p style={mu}>Core rules reference. Tap any section to explore.</p>
      <div style={{ display: "flex", gap: 4, flexWrap: "wrap", margin: "10px 0" }}>
        {tabs.map(([id, label]) => (
          <button key={id} onClick={() => { setSec(id); setExp(null); }} style={{ ...bs(sec === id ? "#C9772E" : "#9AA5B1"), background: sec === id ? "#C9772E15" : "transparent", padding: "4px 8px", fontSize: 10 }}>{label}</button>
        ))}
      </div>

      {/* CORE */}
      {sec === "core" && CORE_CONCEPTS.map((c, i) => (
        <RuleCard key={i} title={c.name}><div style={mu}>{c.desc}</div></RuleCard>
      ))}

      {/* ACTIONS */}
      {sec === "actions" && CORE_ACTIONS.map((a, i) => (
        <div key={i} onClick={() => setExp(exp === i ? null : i)} style={{ ...cd, padding: 10, cursor: "pointer" }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: exp === i ? "#B8341C" : "#F1F2F5" }}>{a.name}</span>
            <span style={bg("#B8341C")}>{a.ap}AP</span>
          </div>
          {exp === i && (
            <div>
              <div style={{ ...mu, marginTop: 4 }}>{a.desc}</div>
              <div style={{ ...mu, marginTop: 3, paddingLeft: 8, borderLeft: "2px solid #B8341C40", color: "#B8341C" }}>{a.restrict}</div>
            </div>
          )}
        </div>
      ))}

      {/* TERRAIN */}
      {sec === "terrain" && (
        <div>
          <div style={{ ...mu, marginBottom: 10 }}>Terrain features are composed of parts, each with a type. One part can be multiple types. Always view terrain in parts, not as one feature. If a rule says ignore Light terrain, only ignore the Light parts.</div>
          {TERRAIN_TYPES.map((t, i) => (
            <div key={i} onClick={() => setExp(exp === i ? null : i)} style={{ ...cd, padding: 12, cursor: "pointer", borderColor: exp === i ? t.color + "60" : "#262A33" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 10, height: 10, borderRadius: 2, background: t.color, flexShrink: 0 }} />
                <span style={{ fontSize: 13, fontWeight: 600, color: exp === i ? t.color : "#F1F2F5" }}>{t.name}</span>
              </div>
              <div style={{ ...mu, marginTop: 4 }}>{t.desc}</div>
              {exp === i && (
                <div style={{ marginTop: 6 }}>
                  {t.rules.map((r, j) => (
                    <div key={j} style={{ ...mu, paddingLeft: 8, borderLeft: "2px solid " + t.color + "40", marginBottom: 3, fontSize: 10 }}>{r}</div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* MOVEMENT */}
      {sec === "movement" && (
        <div>
          <div style={{ ...mu, marginBottom: 10 }}>Operatives cannot move through terrain. They must move around, climb over, or drop/jump off it.</div>
          {MOVEMENT_RULES.map((m, i) => (
            <RuleCard key={i} title={m.name} color="#C9772E">
              <div style={mu}>{m.desc}</div>
            </RuleCard>
          ))}
        </div>
      )}

      {/* VISIBILITY */}
      {sec === "visibility" && (
        <div>
          <div style={{ ...mu, marginBottom: 10 }}>Visibility, cover, and obscured are the three key concepts for determining what operatives can see and target.</div>
          {VISIBILITY_RULES.map((v, i) => (
            <div key={i} onClick={() => setExp(exp === i ? null : i)} style={{ ...cd, padding: 12, cursor: "pointer", borderColor: exp === i ? "#6B9BF760" : "#262A33" }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: exp === i ? "#6B9BF7" : "#F1F2F5" }}>{v.name}</div>
              <div style={{ ...mu, marginTop: 4 }}>{v.desc}</div>
            </div>
          ))}
        </div>
      )}

      {/* WEAPON RULES */}
      {sec === "weapons" && Object.entries(WR).map(([k, v], i) => (
        <div key={i} onClick={() => setExp(exp === i ? null : i)} style={{ ...cd, padding: 8, cursor: "pointer" }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: exp === i ? "#C9772E" : "#F1F2F5" }}>{k}</div>
          {exp === i && (<div style={{ ...mu, marginTop: 3 }}>{v}</div>)}
        </div>
      ))}

      {/* SHOOTING */}
      {sec === "shooting" && (
        <div>
          <div style={cd}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#B8341C", fontFamily: "'Rajdhani', sans-serif", marginBottom: 6, letterSpacing: "0.04em" }}>Shooting Sequence</div>
            <StepList color="#B8341C" items={[
              "Select Weapon: Choose one ranged weapon and collect ATK dice (D6s equal to weapon's ATK stat).",
              "Select Valid Target: Enemy that's a valid target with no friendly operatives in its control range. Engage = visible. Conceal = visible AND not in cover.",
              "Roll Attack Dice: Each result >= Hit stat is a success (retained). 6 = critical success. 1 = always fail. If target is obscured: discard one success, all crits become normals.",
              "Roll Defence Dice: Defender collects 3D6. If target in cover: retain one as auto normal success (cover save). Roll remainder. >= Save stat = success. 6 = crit.",
              "Resolve Defence Dice: Allocate to block attack successes. Normal blocks normal. Two normals block a crit. Crit blocks normal or crit.",
              "Resolve Attack Dice: Unblocked normal = Normal Dmg. Unblocked crit = Critical Dmg. Incapacitated operatives removed after entire action resolves.",
            ]} />
          </div>
          <RuleCard title="Key Shooting Rules" color="#B8341C">
            <div style={mu}>Cannot Shoot while Concealed or in enemy control range. Cannot target friendlies in target's control range. Operatives incapacitated during Blast/Torrent aren't removed until the full action resolves. When you are both attacker and defender (e.g. Blast hitting friendly), you roll both sets of dice.</div>
          </RuleCard>
        </div>
      )}

      {/* FIGHTING */}
      {sec === "fighting" && (
        <div>
          <div style={cd}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#B8341C", fontFamily: "'Rajdhani', sans-serif", marginBottom: 6, letterSpacing: "0.04em" }}>Fighting Sequence</div>
            <StepList color="#B8341C" items={[
              "Select Enemy Operative: Choose enemy within control range. That enemy retaliates. (Fighting = active operative. Retaliating = selected enemy.)",
              "Select Weapons: Both players select one melee weapon and collect ATK dice.",
              "Roll Attack Dice: Both roll simultaneously. >= Hit = success. 6 = crit. 1 = fail. Assists: each friendly within CR of the enemy (not in CR of another enemy) improves Hit by 1.",
              "Resolve Attack Dice: Starting with attacker, alternate resolving one success each. Strike: inflict Normal/Critical Dmg (immediate). Block: cancel one opponent unresolved success (normal blocks normal, crit blocks normal or crit). You can block even with no opponent successes remaining.",
            ]} />
          </div>
          <RuleCard title="Key Fighting Rules" color="#B8341C">
            <div style={mu}>Must have enemy in control range. Striking deals damage immediately — use this to kill before the enemy strikes back. Blocking cancels a future strike — use to survive. If one operative is incapacitated, the other resolves all remaining dice. You can block with no opponent dice left (useful to avoid killing an enemy you want alive).</div>
          </RuleCard>
        </div>
      )}

      {/* UNIVERSAL EQUIPMENT */}
      {sec === "equipment" && (
        <div>
          <div style={{ ...mu, marginBottom: 10 }}>Universal equipment available to all kill teams. Select before battle per game sequence. Each option selected once per game. Faction equipment is separate.</div>
          {UNIV_EQUIPMENT.map((e, i) => (
            <div key={i} onClick={() => setExp(exp === i ? null : i)} style={{ ...cd, padding: 12, cursor: "pointer", borderColor: exp === i ? "#C9772E60" : "#262A33" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: exp === i ? "#C9772E" : "#F1F2F5" }}>{e.name}</span>
                <span style={bg(e.type === "weapon" ? "#B8341C" : e.type === "action" ? "#C9772E" : "#9AA5B1")}>{e.type}</span>
              </div>
              <div style={{ ...mu, marginTop: 4 }}>{e.desc}</div>
              {exp === i && e.stats && (
                <div style={{ background: "#1A1D24", borderRadius: 5, padding: "6px 8px", marginTop: 6, border: "1px solid #262A33" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 2 }}>
                    {[["ATK", e.stats.atk], ["HIT", e.stats.hit], ["DMG", e.stats.dmg]].map(([label, val]) => (
                      <div key={label}>
                        <div style={{ fontSize: 8, color: "#9AA5B1" }}>{label}</div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: "#C9772E", fontFamily: "monospace" }}>{val}</div>
                      </div>
                    ))}
                  </div>
                  {e.stats.wr && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 2, marginTop: 3 }}>
                      {e.stats.wr.split(", ").map((r, j) => (
                        <Tip key={j} k={r}><span style={{ ...pl, fontSize: 8 }}>{r}</span></Tip>
                      ))}
                    </div>
                  )}
                </div>
              )}
              {exp === i && e.note && (
                <div style={{ fontSize: 10, color: "#C9772E", marginTop: 4, fontStyle: "italic" }}>{e.note}</div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* GLOSSARY */}
      {sec === "glossary" && (
        <div>
          <div style={{ ...mu, marginBottom: 10 }}>Quick reference for common terms and abbreviations.</div>
          <div style={cd}>
            {GLOSSARY.map((g, i) => (
              <div key={i} style={{ display: "flex", gap: 8, padding: "6px 0", borderBottom: i < GLOSSARY.length - 1 ? "1px solid #1A2430" : "none" }}>
                <div style={{ width: 80, flexShrink: 0, fontSize: 12, fontWeight: 700, color: "#C9772E", fontFamily: "monospace" }}>{g.term}</div>
                <div style={{ ...mu, flex: 1 }}>{g.def}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ TUTORIAL ═══ */
function Tutorial() {
  const mobile = useIsMobile();
  const [step, setStep] = useState(0);
  const [diceResults, setDiceResults] = useState(null);
  const [playerInit, setPlayerInit] = useState(null);
  const [botInit, setBotInit] = useState(null);
  const [atkDice, setAtkDice] = useState(null);
  const [defDice, setDefDice] = useState(null);
  const [meleePlayerDice, setMeleePlayerDice] = useState(null);
  const [meleeBotDice, setMeleeBotDice] = useState(null);
  const [meleeStep, setMeleeStep] = useState(0);
  const [meleePlayerSuccesses, setMeleePlayerSuccesses] = useState([]);
  const [meleeBotSuccesses, setMeleeBotSuccesses] = useState([]);
  const [playerHP, setPlayerHP] = useState({ marine1: 12, marine2: 12 });
  const [botHP, setBotHP] = useState({ boy1: 10, boy2: 10 });
  const [choice, setChoice] = useState(null);
  const [shootDmg, setShootDmg] = useState(0);

  const rollD6 = () => Math.floor(Math.random() * 6) + 1;
  const rollMultiple = (n) => Array.from({ length: n }, rollD6);

  const DieBox = ({ val, color, size }) => (
    <div style={{ width: size || 36, height: size || 36, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 4, background: "#0E0F13", border: "2px solid " + (color || "#C9772E"), fontSize: size ? size * 0.5 : 18, fontWeight: 700, color: color || "#C9772E", fontFamily: "'Courier New', monospace", boxShadow: "0 2px 8px rgba(0,0,0,0.5)" }}>{val}</div>
  );

  const Narrator = ({ children }) => (
    <div style={{ fontSize: 13, color: "#F1F2F5", lineHeight: 1.7, marginBottom: 12 }}>{children}</div>
  );

  const Highlight = ({ children, color }) => (
    <span style={{ color: color || "#C9772E", fontWeight: 700 }}>{children}</span>
  );

  const UnitCard = ({ name, hp, maxHp, color, stats }) => {
    const pct = (hp / maxHp) * 100;
    const barColor = pct > 50 ? "#3D6B3F" : pct > 25 ? "#C9772E" : "#B8341C";
    return (
      <div style={{ background: "#262A33", border: "1px solid " + color + "40", borderRadius: 4, padding: "8px 12px", flex: 1, minWidth: 120 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color, fontFamily: "'Rajdhani', sans-serif" }}>{name}</div>
        <div style={{ fontSize: 10, color: "#9AA5B1", marginTop: 2 }}>{stats}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
          <div style={{ flex: 1, height: 4, background: "#262A33", borderRadius: 2, overflow: "hidden" }}>
            <div style={{ height: "100%", width: pct + "%", background: barColor, transition: "width 0.5s" }} />
          </div>
          <div style={{ fontSize: 10, fontWeight: 700, color: barColor }}>{hp}/{maxHp}</div>
        </div>
      </div>
    );
  };

  const ActionBtn = ({ children, onClick, color, disabled }) => (
    <button onClick={onClick} disabled={disabled} style={{ ...bs(color || "#C9772E"), padding: "10px 16px", fontSize: 12, fontWeight: 700, width: "100%", marginBottom: 6, background: (color || "#C9772E") + "10", opacity: disabled ? 0.4 : 1, cursor: disabled ? "not-allowed" : "pointer", letterSpacing: "0.04em" }}>{children}</button>
  );

  const NextBtn = ({ onClick, label }) => (
    <button onClick={onClick} style={{ ...bs("#C9772E"), padding: "10px 20px", fontSize: 12, fontWeight: 700, marginTop: 8, background: "#C9772E10" }}>{label || "Continue \u25B6"}</button>
  );

  const Section = ({ title, phase, children }) => {
    const pc = { Setup: "#9AA5B1", Strategy: "#C9772E", Firefight: "#B8341C", Combat: "#B8341C", Shooting: "#C9772E", Fighting: "#B8341C", Scoring: "#9B59B6" };
    const c = pc[phase] || "#C9772E";
    return (
      <div style={{ ...cd, padding: mobile ? 14 : 20, borderColor: c + "40", marginBottom: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <span style={bg(c)}>{phase}</span>
          <span style={{ fontSize: 10, color: "#9AA5B1" }}>Step {step + 1} / 12</span>
        </div>
        <div style={{ fontSize: 18, fontWeight: 700, color: c, fontFamily: "'Rajdhani', sans-serif", marginBottom: 10, letterSpacing: "0.04em", textShadow: "0 1px 8px " + c + "30" }}>{title}</div>
        {children}
      </div>
    );
  };

  const Battlefield = () => (
    <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
      <div style={{ flex: 1, minWidth: 140 }}>
        <div style={{ fontSize: 9, fontWeight: 700, color: "#3D6B3F", letterSpacing: "0.1em", marginBottom: 4 }}>YOUR TEAM</div>
        <UnitCard name="Intercessor Sgt" hp={playerHP.marine1} maxHp={12} color="#3D6B3F" stats="APL 3 \u2022 3+ Save \u2022 Bolt rifle 4/5" />
        <div style={{ height: 4 }} />
        <UnitCard name="Intercessor" hp={playerHP.marine2} maxHp={12} color="#3D6B3F" stats="APL 3 \u2022 3+ Save \u2022 Bolt rifle 4/5" />
      </div>
      <div style={{ flex: 1, minWidth: 140 }}>
        <div style={{ fontSize: 9, fontWeight: 700, color: "#B8341C", letterSpacing: "0.1em", marginBottom: 4 }}>ENEMY TEAM</div>
        <UnitCard name="Ork Boy Nob" hp={botHP.boy1} maxHp={10} color="#B8341C" stats="APL 2 \u2022 5+ Save \u2022 Choppa 4/5" />
        <div style={{ height: 4 }} />
        <UnitCard name="Ork Boy" hp={botHP.boy2} maxHp={10} color="#B8341C" stats="APL 2 \u2022 5+ Save \u2022 Slugga 3/4" />
      </div>
    </div>
  );

  const restart = () => {
    setStep(0); setDiceResults(null); setPlayerInit(null); setBotInit(null);
    setAtkDice(null); setDefDice(null); setChoice(null); setShootDmg(0);
    setMeleePlayerDice(null); setMeleeBotDice(null); setMeleeStep(0);
    setMeleePlayerSuccesses([]); setMeleeBotSuccesses([]);
    setPlayerHP({ marine1: 12, marine2: 12 }); setBotHP({ boy1: 10, boy2: 10 });
  };

  // Progress bar
  const Progress = () => (
    <div style={{ display: "flex", gap: 2, marginBottom: 12 }}>
      {Array.from({ length: 12 }, (_, i) => (
        <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? (i < 3 ? "#C9772E" : i < 9 ? "#B8341C" : "#9B59B6") : "#262A33", transition: "background 0.3s" }} />
      ))}
    </div>
  );

  const steps = [
    // 0: Welcome
    () => (
      <Section title="Welcome, Commander" phase="Setup">
        <Narrator>
          This tutorial will walk you through <Highlight>one full Turning Point</Highlight> of play. You'll roll for initiative, activate operatives, execute a shooting attack, and fight in melee combat.
        </Narrator>
        <Narrator>
          You command <Highlight color="#3D6B3F">two Space Marine Intercessors</Highlight>. The enemy has <Highlight color="#B8341C">two Ork Boyz</Highlight>. Your Marines are tougher and shoot better. The Orks are scrappy in melee.
        </Narrator>
        <Battlefield />
        <Narrator>
          A game lasts <Highlight>4 Turning Points</Highlight>. Each TP has two phases: <Highlight>Strategy</Highlight> (planning) and <Highlight color="#B8341C">Firefight</Highlight> (action). Let's begin.
        </Narrator>
        <NextBtn onClick={() => setStep(1)} label="Start Turning Point 1 \u25B6" />
      </Section>
    ),

    // 1: Initiative
    () => (
      <Section title="Roll for Initiative" phase="Strategy">
        <Narrator>
          Both players roll <Highlight>1D6</Highlight>. Highest chooses who has initiative. The player with initiative <Highlight>activates first</Highlight> but gains <Highlight color="#B8341C">fewer Command Points</Highlight> next turn (+1 vs +2).
        </Narrator>
        {!playerInit ? (
          <ActionBtn onClick={() => {
            const p = rollD6(); const b = rollD6();
            setPlayerInit(p); setBotInit(b);
          }}>
            {"\u2684"} Roll for Initiative
          </ActionBtn>
        ) : (
          <div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 12 }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 9, color: "#3D6B3F", fontWeight: 700, marginBottom: 4 }}>YOU</div>
                <DieBox val={playerInit} color={playerInit >= botInit ? "#3D6B3F" : "#B8341C"} />
              </div>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 9, color: "#B8341C", fontWeight: 700, marginBottom: 4 }}>ENEMY</div>
                <DieBox val={botInit} color={botInit > playerInit ? "#B8341C" : "#9AA5B1"} />
              </div>
            </div>
            <Narrator>
              {playerInit > botInit
                ? <span>You rolled higher! You choose to <Highlight>take initiative</Highlight>. You'll activate first this TP but gain fewer CP next turn.</span>
                : playerInit < botInit
                ? <span>The enemy rolled higher. They take initiative and will act first. But you'll gain <Highlight>+2CP</Highlight> next TP instead of +1.</span>
                : <span>It's a tie! In TP1, the player without initiative chooses. You <Highlight>take initiative</Highlight>.</span>
              }
            </Narrator>
            <NextBtn onClick={() => setStep(2)} />
          </div>
        )}
      </Section>
    ),

    // 2: Strategy Phase
    () => (
      <Section title="Strategy Phase" phase="Strategy">
        <Narrator>
          In the Strategy phase you: gain <Highlight>Command Points</Highlight> (start with 2, +1 per TP for initiative holder), <Highlight>ready all operatives</Highlight>, choose <Highlight>orders</Highlight> (Engage or Conceal) for each operative, and optionally spend CP on <Highlight>Strategic Ploys</Highlight>.
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #262A33", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#C9772E", marginBottom: 6 }}>KEY CONCEPTS:</div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.6 }}>
            <Highlight>Engage Order</Highlight> — Operative can be targeted and can Shoot freely. Normal combat mode.{"\n"}
          </div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.6, marginTop: 4 }}>
            <Highlight>Conceal Order</Highlight> — Operative hides. Cannot be targeted if in cover (behind terrain). But cannot Shoot.
          </div>
        </div>
        <Narrator>
          You give your <Highlight color="#3D6B3F">Intercessor Sergeant</Highlight> an <Highlight>Engage</Highlight> order (he'll shoot). Your second Marine gets <Highlight>Conceal</Highlight> (he'll stay safe near an objective).
        </Narrator>
        <NextBtn onClick={() => setStep(3)} label="Begin Firefight Phase \u25B6" />
      </Section>
    ),

    // 3: Firefight - First Activation
    () => (
      <Section title="Firefight Phase — Your Activation" phase="Firefight">
        <Battlefield />
        <Narrator>
          Players alternate activating one operative each. Since you have initiative, <Highlight>you go first</Highlight>. Each operative has <Highlight>Action Points (APL)</Highlight> — your Marines have APL 3, so 3 actions each.
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #3D6B3F30", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#3D6B3F", marginBottom: 4 }}>INTERCESSOR SGT — 3 APL</div>
          <div style={{ fontSize: 11, color: "#9AA5B1", lineHeight: 1.5 }}>
            Available actions: <Highlight>Move</Highlight> (1AP), <Highlight>Shoot</Highlight> (1AP), <Highlight>Fight</Highlight> (1AP), <Highlight>Dash</Highlight> (1AP), <Highlight>Charge</Highlight> (1AP)
          </div>
        </div>
        <Narrator>
          Let's spend our 3 APL: <Highlight>Move</Highlight> (1AP) into firing position, then <Highlight>Shoot</Highlight> (1AP) at the Ork Boy, then <Highlight>Dash</Highlight> (1AP) behind cover.
        </Narrator>
        <NextBtn onClick={() => setStep(4)} label="Move into Position \u25B6" />
      </Section>
    ),

    // 4: Shooting - Select Target
    () => (
      <Section title="Shooting Attack" phase="Shooting">
        <Narrator>
          Your Intercessor Sgt fires his <Highlight>Bolt Rifle</Highlight> at the <Highlight color="#B8341C">Ork Boy</Highlight>. Here are the weapon stats:
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #C9772E30", marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif" }}>Bolt Rifle</div>
          <div style={{ display: "flex", gap: 20, marginTop: 6 }}>
            <div style={{ textAlign: "center" }}><div style={{ fontSize: 20, fontWeight: 700, color: "#F1F2F5" }}>4</div><div style={{ fontSize: 9, color: "#9AA5B1" }}>ATK DICE</div></div>
            <div style={{ textAlign: "center" }}><div style={{ fontSize: 20, fontWeight: 700, color: "#F1F2F5" }}>3+</div><div style={{ fontSize: 9, color: "#9AA5B1" }}>HIT</div></div>
            <div style={{ textAlign: "center" }}><div style={{ fontSize: 20, fontWeight: 700, color: "#F1F2F5" }}>4/5</div><div style={{ fontSize: 9, color: "#9AA5B1" }}>DMG N/C</div></div>
          </div>
          <div style={{ fontSize: 10, color: "#9AA5B1", marginTop: 6 }}>Accurate 1 \u2022 Balanced \u2022 Heavy</div>
        </div>
        <Narrator>
          <Highlight>ATK 4</Highlight> = roll 4 dice. <Highlight>HIT 3+</Highlight> = 3, 4, 5 are normal hits, 6 is always a critical hit. <Highlight>DMG 4/5</Highlight> = normals deal 4 damage, crits deal 5.
        </Narrator>
        <ActionBtn onClick={() => {
          const rolls = rollMultiple(4);
          setAtkDice(rolls);
        }}>
          {"\u2684"} Roll 4 Attack Dice!
        </ActionBtn>
        {atkDice && (() => {
          const crits = atkDice.filter(d => d >= 6).length;
          const hits = atkDice.filter(d => d >= 3 && d < 6).length;
          const misses = atkDice.filter(d => d < 3).length;
          return (
            <div>
              <div style={{ display: "flex", gap: 6, justifyContent: "center", marginBottom: 8 }}>
                {atkDice.map((d, i) => <DieBox key={i} val={d} color={d >= 6 ? "#C9772E" : d >= 3 ? "#3D6B3F" : "#B8341C"} />)}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center", fontSize: 12, fontWeight: 700, marginBottom: 8 }}>
                <span style={{ color: "#C9772E" }}>{crits} Crit{crits !== 1 ? "s" : ""}</span>
                <span style={{ color: "#3D6B3F" }}>{hits} Hit{hits !== 1 ? "s" : ""}</span>
                <span style={{ color: "#B8341C" }}>{misses} Miss{misses !== 1 ? "es" : ""}</span>
              </div>
              <Narrator>
                {crits + hits > 0
                  ? <span>You scored <Highlight>{crits + hits} success{crits + hits !== 1 ? "es" : ""}</Highlight>! Now the defender rolls. The Ork has a <Highlight color="#B8341C">5+ Save</Highlight> (only 5 and 6 succeed) and rolls <Highlight>3 defence dice</Highlight>.</span>
                  : <span>All misses! The attack whiffs entirely. In a real game you'd move on. Let's pretend you hit and continue the tutorial.</span>
                }
              </Narrator>
              <NextBtn onClick={() => setStep(5)} label="Roll Defence Dice \u25B6" />
            </div>
          );
        })()}
      </Section>
    ),

    // 5: Defence Roll
    () => {
      const atkCrits = atkDice ? atkDice.filter(d => d >= 6).length : 1;
      const atkHits = atkDice ? atkDice.filter(d => d >= 3 && d < 6).length : 2;
      const totalAtk = atkCrits + atkHits;
      return (
      <Section title="Defence Roll" phase="Shooting">
        <Narrator>
          The Ork rolls <Highlight>3 defence dice</Highlight> needing <Highlight color="#B8341C">5+</Highlight> to save. Each save blocks one of your hits. <Highlight>Normal saves block normal hits</Highlight>. <Highlight>Crit saves (6) can block crits or normals</Highlight>.
        </Narrator>
        <ActionBtn onClick={() => {
          const rolls = rollMultiple(3);
          setDefDice(rolls);
        }} disabled={!!defDice}>
          {"\u2684"} Roll 3 Defence Dice (Ork, 5+ Save)
        </ActionBtn>
        {defDice && (() => {
          const critSaves = defDice.filter(d => d >= 6).length;
          const normSaves = defDice.filter(d => d >= 5 && d < 6).length;
          const fails = defDice.filter(d => d < 5).length;
          const totalSaves = critSaves + normSaves;
          // Resolve: block normals first, then crits with crit saves
          let unblockedCrits = atkCrits;
          let unblockedHits = atkHits;
          let remainCritSaves = critSaves;
          let remainNormSaves = normSaves;
          // Normal saves block normal hits
          const normBlocked = Math.min(remainNormSaves, unblockedHits);
          unblockedHits -= normBlocked;
          remainNormSaves -= normBlocked;
          // Crit saves block crits first, then normals
          const critBlocked = Math.min(remainCritSaves, unblockedCrits);
          unblockedCrits -= critBlocked;
          remainCritSaves -= critBlocked;
          const extraBlocked = Math.min(remainCritSaves, unblockedHits);
          unblockedHits -= extraBlocked;
          const dmg = unblockedCrits * 5 + unblockedHits * 4;
          return (
            <div>
              <div style={{ display: "flex", gap: 6, justifyContent: "center", marginBottom: 8 }}>
                {defDice.map((d, i) => <DieBox key={i} val={d} color={d >= 6 ? "#C9772E" : d >= 5 ? "#3D6B3F" : "#B8341C"} />)}
              </div>
              <div style={{ display: "flex", gap: 12, justifyContent: "center", fontSize: 12, fontWeight: 700, marginBottom: 8 }}>
                <span style={{ color: "#C9772E" }}>{critSaves} Crit Save{critSaves !== 1 ? "s" : ""}</span>
                <span style={{ color: "#3D6B3F" }}>{normSaves} Save{normSaves !== 1 ? "s" : ""}</span>
                <span style={{ color: "#B8341C" }}>{fails} Fail{fails !== 1 ? "s" : ""}</span>
              </div>
              <div style={{ background: "#262A33", borderRadius: 4, padding: 10, border: "1px solid #262A33", marginBottom: 10 }}>
                <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.6 }}>
                  Your {totalAtk} attack success{totalAtk !== 1 ? "es" : ""} vs {totalSaves} save{totalSaves !== 1 ? "s" : ""} = <Highlight color="#B8341C">{unblockedCrits + unblockedHits} unblocked</Highlight>
                  {unblockedCrits > 0 && <span> ({unblockedCrits} crit{unblockedCrits !== 1 ? "s" : ""} \u00D7 5dmg)</span>}
                  {unblockedHits > 0 && <span> ({unblockedHits} normal{unblockedHits !== 1 ? "s" : ""} \u00D7 4dmg)</span>}
                  {" "}= <Highlight color="#B8341C">{dmg} total damage</Highlight> to the Ork Boy ({botHP.boy2}W).
                </div>
              </div>
              <Narrator>
                {dmg >= botHP.boy2
                  ? <span>The Ork Boy is <Highlight color="#B8341C">incapacitated</Highlight>! Removed from play. Below half wounds = <Highlight>Injured</Highlight> (-2" Move, -1 Hit).</span>
                  : dmg > 0
                  ? <span>The Ork takes {dmg} damage, dropping to <Highlight color="#B8341C">{botHP.boy2 - dmg}W</Highlight>.{botHP.boy2 - dmg <= 5 ? " He's now Injured! (-2\" Move, -1 Hit)" : ""}</span>
                  : <span>All blocked! The Ork shrugs it off. Tough luck.</span>
                }
              </Narrator>
              <NextBtn onClick={() => {
                const newHp = Math.max(0, botHP.boy2 - dmg);
                setBotHP(prev => ({ ...prev, boy2: newHp }));
                setShootDmg(dmg);
                setStep(6);
              }} />
            </div>
          );
        })()}
      </Section>
      );
    },

    // 6: Enemy Activation
    () => (
      <Section title="Enemy Activation" phase="Firefight">
        <Battlefield />
        <Narrator>
          After your operative finishes, the <Highlight color="#B8341C">enemy activates one of theirs</Highlight>. Players alternate: you activate one, they activate one, until all operatives are expended.
        </Narrator>
        <Narrator>
          The <Highlight color="#B8341C">Ork Boy Nob</Highlight> uses <Highlight>Charge</Highlight> (1AP) — a special move that adds 2" to their movement and lets them engage in melee. He reaches your <Highlight color="#3D6B3F">Intercessor</Highlight> and will now <Highlight color="#B8341C">Fight</Highlight> (1AP).
        </Narrator>
        <div style={{ background: "#B8341C10", borderRadius: 4, padding: 12, border: "1px solid #B8341C30", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#B8341C", marginBottom: 4 }}>CHARGE + FIGHT</div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.6 }}>
            Charge (1AP): Move + 2" extra. Must end within 1" of enemy (Control Range). Fight (1AP): Both operatives roll their melee weapons and alternate strikes.
          </div>
        </div>
        <NextBtn onClick={() => setStep(7)} label="Enter Melee Combat \u25B6" />
      </Section>
    ),

    // 7: Melee - Roll
    () => (
      <Section title="Fight — Roll Attack Dice" phase="Fighting">
        <Narrator>
          In melee, <Highlight>both operatives roll simultaneously</Highlight> using their melee weapon. Then they <Highlight>alternate: Strike or Block</Highlight>. The attacker (who initiated) goes first.
        </Narrator>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <div style={{ flex: 1, background: "#B8341C10", borderRadius: 4, padding: 10, border: "1px solid #B8341C30", minWidth: 140 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#B8341C" }}>Ork Nob — Choppa</div>
            <div style={{ fontSize: 10, color: "#9AA5B1" }}>ATK 4 \u2022 HIT 3+ \u2022 DMG 4/5</div>
          </div>
          <div style={{ flex: 1, background: "#3D6B3F10", borderRadius: 4, padding: 10, border: "1px solid #3D6B3F30", minWidth: 140 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#3D6B3F" }}>Intercessor — Fists</div>
            <div style={{ fontSize: 10, color: "#9AA5B1" }}>ATK 3 \u2022 HIT 3+ \u2022 DMG 3/4</div>
          </div>
        </div>
        <ActionBtn onClick={() => {
          const pRolls = rollMultiple(3);
          const bRolls = rollMultiple(4);
          setMeleePlayerDice(pRolls);
          setMeleeBotDice(bRolls);
          const ps = []; const bs2 = [];
          pRolls.forEach(d => { if (d >= 6) ps.push("crit"); else if (d >= 3) ps.push("hit"); });
          bRolls.forEach(d => { if (d >= 6) bs2.push("crit"); else if (d >= 3) bs2.push("hit"); });
          setMeleePlayerSuccesses(ps);
          setMeleeBotSuccesses(bs2);
        }} disabled={!!meleePlayerDice}>
          {"\u2694"} Both Roll Melee Dice!
        </ActionBtn>
        {meleePlayerDice && meleeBotDice && (() => {
          return (
            <div>
              <div style={{ display: "flex", gap: 20, justifyContent: "center", marginBottom: 12 }}>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 9, color: "#B8341C", fontWeight: 700, marginBottom: 4 }}>ORK NOB (4 dice)</div>
                  <div style={{ display: "flex", gap: 4 }}>{meleeBotDice.map((d, i) => <DieBox key={i} val={d} color={d >= 6 ? "#C9772E" : d >= 3 ? "#B8341C" : "#9AA5B1"} size={30} />)}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#B8341C", marginTop: 4 }}>{meleeBotSuccesses.length} success{meleeBotSuccesses.length !== 1 ? "es" : ""}</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 9, color: "#3D6B3F", fontWeight: 700, marginBottom: 4 }}>YOUR MARINE (3 dice)</div>
                  <div style={{ display: "flex", gap: 4 }}>{meleePlayerDice.map((d, i) => <DieBox key={i} val={d} color={d >= 6 ? "#C9772E" : d >= 3 ? "#3D6B3F" : "#9AA5B1"} size={30} />)}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#3D6B3F", marginTop: 4 }}>{meleePlayerSuccesses.length} success{meleePlayerSuccesses.length !== 1 ? "es" : ""}</div>
                </div>
              </div>
              <NextBtn onClick={() => setStep(8)} label="Resolve Strikes \u25B6" />
            </div>
          );
        })()}
      </Section>
    ),

    // 8: Melee - Resolution
    () => {
      const bSucc = meleeBotSuccesses.length || 2;
      const pSucc = meleePlayerSuccesses.length || 1;
      const bCrits = (meleeBotSuccesses || []).filter(s => s === "crit").length;
      const bNorms = bSucc - bCrits;
      const pCrits = (meleePlayerSuccesses || []).filter(s => s === "crit").length;
      const pNorms = pSucc - pCrits;
      // Simplified: Ork strikes first (attacker), then alternate
      const orkDmg = bCrits * 5 + bNorms * 4;
      const marineDmg = pCrits * 4 + pNorms * 3;
      return (
      <Section title="Resolving Melee" phase="Fighting">
        <Narrator>
          Now both players <Highlight>alternate</Highlight>. The attacker (Ork, who Charged) picks first each time. Each success can either <Highlight>Strike</Highlight> (deal damage immediately) or <Highlight>Block</Highlight> (cancel one opponent success). A <Highlight>crit block cancels any success</Highlight>. A <Highlight>normal block only cancels a normal</Highlight>.
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #262A33", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#C9772E", marginBottom: 6 }}>RESOLUTION EXAMPLE:</div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.7 }}>
            The Ork has {bSucc} success{bSucc !== 1 ? "es" : ""} ({bCrits} crit, {bNorms} normal). Your Marine has {pSucc} ({pCrits} crit, {pNorms} normal).
          </div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.7, marginTop: 6 }}>
            Typically the attacker <Highlight color="#B8341C">strikes aggressively</Highlight> to maximize damage, while the defender <Highlight color="#3D6B3F">blocks first</Highlight> to survive. In our example:
          </div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.7, marginTop: 6 }}>
            \u2022 Ork takes <Highlight color="#B8341C">{orkDmg} total potential damage</Highlight> (crits \u00D7 5 + normals \u00D7 4){"\n"}
            \u2022 Marine retaliates with <Highlight color="#3D6B3F">{marineDmg} potential damage</Highlight> (crits \u00D7 4 + normals \u00D7 3){"\n"}
            \u2022 Blocked strikes are cancelled. Unblocked ones deal damage.
          </div>
        </div>
        <Narrator>
          After resolving all strikes, the Ork deals damage to your Marine and your Marine deals damage back. {orkDmg > 0 ? "Your Marine takes a beating!" : "The Ork whiffed!"} This is why melee is <Highlight color="#B8341C">dangerous</Highlight> — both fighters get hurt.
        </Narrator>
        <NextBtn onClick={() => {
          setPlayerHP(prev => ({ ...prev, marine2: Math.max(0, prev.marine2 - Math.max(0, orkDmg - marineDmg)) }));
          setBotHP(prev => ({ ...prev, boy1: Math.max(0, prev.boy1 - Math.min(marineDmg, prev.boy1)) }));
          setStep(9);
        }} />
      </Section>
      );
    },

    // 9: Remaining Activations
    () => (
      <Section title="Remaining Activations" phase="Firefight">
        <Battlefield />
        <Narrator>
          Players keep alternating activations until all operatives are <Highlight>expended</Highlight> (used all their APL). With 2 operatives each, that's 4 total activations this TP.
        </Narrator>
        <Narrator>
          If one player runs out of operatives first, the other activates all remaining operatives in a row. If you had <Highlight>3 operatives</Highlight> vs their 2, you'd get a bonus activation at the end.
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #262A33", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#C9772E", marginBottom: 6 }}>COMMON ACTIONS (1 APL EACH):</div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.8 }}>
            <Highlight>Move</Highlight> — Move up to Movement stat{"\n"}
            <Highlight>Shoot</Highlight> — Fire a ranged weapon at a valid target{"\n"}
            <Highlight>Fight</Highlight> — Melee attack an enemy in Control Range{"\n"}
            <Highlight>Charge</Highlight> — Move + 2" and engage enemy{"\n"}
            <Highlight>Dash</Highlight> — Move up to 3"{"\n"}
            <Highlight>Pick Up</Highlight> — Interact with objectives
          </div>
        </div>
        <NextBtn onClick={() => setStep(10)} label="End of Firefight Phase \u25B6" />
      </Section>
    ),

    // 10: End of TP
    () => (
      <Section title="End of Turning Point" phase="Scoring">
        <Battlefield />
        <Narrator>
          After all operatives are expended, the Turning Point ends. Now you <Highlight color="#9B59B6">score Victory Points</Highlight>:
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #9B59B630", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#9B59B6", marginBottom: 6 }}>SCORING:</div>
          <div style={{ fontSize: 11, color: "#F1F2F5", lineHeight: 1.8 }}>
            <Highlight color="#9B59B6">Primary Mission</Highlight> — Control objectives. More = 2VP, equal = 1VP, fewer = 0VP.{"\n"}
            <Highlight color="#9B59B6">Tac Ops</Highlight> — Secret objectives you chose pre-game. Each has 2 scoring conditions worth 1VP each.{"\n"}
            <Highlight color="#9B59B6">Total</Highlight> — Max ~18VP across 4 TPs. Highest VP wins.
          </div>
        </div>
        <Narrator>
          Then <Highlight>remove incapacitated operatives</Highlight>, check for injured models (below half wounds), and prepare for the next Turning Point. CP carries over and you gain more next TP.
        </Narrator>
        <NextBtn onClick={() => setStep(11)} label="Summary \u25B6" />
      </Section>
    ),

    // 11: Summary
    () => (
      <Section title="You've Completed a Turning Point!" phase="Setup">
        <Battlefield />
        <Narrator>
          Congratulations! You've played through all the core mechanics:
        </Narrator>
        <div style={{ background: "#262A33", borderRadius: 4, padding: 12, border: "1px solid #C9772E30", marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: "#F1F2F5", lineHeight: 2 }}>
            {"\u2714"} <Highlight>Initiative</Highlight> — Roll D6, highest chooses{"\n"}
            {"\u2714"} <Highlight>Strategy Phase</Highlight> — Orders, CP, ploys{"\n"}
            {"\u2714"} <Highlight>Firefight Phase</Highlight> — Alternate activations{"\n"}
            {"\u2714"} <Highlight color="#C9772E">Shooting</Highlight> — ATK dice vs Defence dice{"\n"}
            {"\u2714"} <Highlight color="#B8341C">Melee</Highlight> — Both roll, alternate Strike/Block{"\n"}
            {"\u2714"} <Highlight color="#9B59B6">Scoring</Highlight> — Primary + Tac Ops = VP
          </div>
        </div>
        <Narrator>
          A full game repeats this for <Highlight>4 Turning Points</Highlight>. Use the <Highlight>Builder</Highlight> tab to build your real army, and the <Highlight>Sequence</Highlight> tab as a phase-by-phase checklist during play.
        </Narrator>
        <div style={{ display: "flex", gap: 8 }}>
          <ActionBtn onClick={restart} color="#9AA5B1">{"\u21BA"} Play Again</ActionBtn>
        </div>
      </Section>
    ),
  ];

  return (
    <div style={{ maxWidth: 700, margin: "0 auto", padding: "20px 16px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={{ fontSize: 22, fontWeight: 700, color: "#C9772E", fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.04em", textShadow: "0 1px 8px rgba(255,215,0,0.2)" }}>Tutorial</div>
        {step > 0 && <button onClick={restart} style={{ ...bs("#9AA5B1"), fontSize: 9, padding: "4px 10px" }}>{"\u21BA"} Restart</button>}
      </div>
      <p style={{ ...mu, marginBottom: 10 }}>Interactive walkthrough — play through a full Turning Point against a bot.</p>
      <Progress />
      {steps[Math.min(step, steps.length - 1)]()}
    </div>
  );
}

/* ═══ APP ═══ */
function App() {
  const [tab, setTab] = useLocalStorage("tab", "builder");
  // Migration: anyone whose persisted tab is "sequence" (now deleted) gets bounced to Builder
  React.useEffect(() => { if (tab === "sequence") setTab("builder"); }, [tab]);
  const [tp, setTp] = useLocalStorage("tp", 1);
  const mobile = useIsMobile();
  const tabs = [["rules", "Rules"], ["builder", "Builder"], ["tutorial", "Tutorial"], ["community", "Community Rosters"]];
  // Multiplayer hosted at App level so banner is visible across tabs
  const mpHandlerRef = React.useRef(null);
  const mp = useMultiplayer((msg) => { if (mpHandlerRef.current) mpHandlerRef.current(msg); });
  const [showMP, setShowMP] = useState(false);

  return (
    <div style={{ minHeight: "100vh", background: "#0E0F13", color: "#F1F2F5", fontFamily: "'Inter', 'Segoe UI', sans-serif", fontSize: 14 }}>

      {/* CONNECTION BANNER (across all tabs) */}
      {mp.status !== "idle" && (
        <div style={{
          position: "sticky", top: 0, zIndex: 9998,
          background: mp.status === "connected" ? "#0F1F12" : mp.status === "error" ? "#1F0F0F" : "#1F1A0A",
          borderBottom: "1px solid " + (mp.status === "connected" ? "#3D6B3F" : mp.status === "error" ? "#B8341C" : "#C9772E"),
          padding: "6px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap"
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 10, fontFamily: "'Rajdhani', sans-serif", letterSpacing: "0.06em" }}>
            <span style={{ color: mp.status === "connected" ? "#3D6B3F" : mp.status === "error" ? "#B8341C" : "#C9772E", fontWeight: 700 }}>
              {mp.status === "connected" ? "\u25CF" : mp.status === "error" ? "\u26A0" : "\u25CB"}
            </span>
            <span style={{ color: "#F1F2F5" }}>
              {mp.status === "hosting" && (mobile ? "Hosting" : "Hosting \u2014 waiting for opponent")}
              {mp.status === "joining" && "Connecting..."}
              {mp.status === "connected" && (mobile ? "Live" : "Connected \u2014 " + mp.role)}
              {mp.status === "error" && (mp.peerError || "Error")}
            </span>
            {mp.roomCode && (
              <span style={{ color: "#C9772E", fontFamily: "monospace", letterSpacing: "0.15em", fontWeight: 700 }}>{mp.roomCode}</span>
            )}
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            <button onClick={() => { if (tab !== "builder") setTab("builder"); setShowMP(true); }} style={{ ...bs("#6B9BF7"), fontSize: 8, padding: "2px 8px" }}>{mp.status === "connected" ? "\u270E Chat" : "Manage"}</button>
            <button onClick={mp.disconnect} style={{ ...bs("#9AA5B1"), fontSize: 8, padding: "2px 8px" }}>{"\u2716"} Disconnect</button>
          </div>
        </div>
      )}

      {/* HEADER */}
      <div style={{ padding: mobile ? "16px 12px 12px" : "28px 16px 20px", textAlign: "center", background: "#1A1D24", borderBottom: "1px solid #3A4150" }}>
        {!mobile && <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: "0.32em", color: "#9AA5B1", fontFamily: "'Rajdhani', sans-serif", textTransform: "uppercase", marginBottom: 8 }}>Tactical Skirmish Companion</div>}
