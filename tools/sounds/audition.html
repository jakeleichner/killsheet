<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound picks</title>
<style>
  :root { --bg: #0d0f12; --card: #171a1f; --line: #2a2f37; --text: #e8e6e1; --dim: #9a978f; --accent: #c9a24a; --pick: #3d6b3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  p.lead { color: var(--dim); margin: 0 0 14px; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
  .bar label { color: var(--dim); font-size: 13px; }
  .bar input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 26px 0 8px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 10px; }
  .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .name { font-weight: 600; }
  .eg { color: var(--dim); font-size: 13px; }
  .opts { display: grid; gap: 8px; margin-top: 10px; }
  .opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .opt.picked { border-color: var(--pick); background: #1c2a1c; }
  .opt button.play { flex: none; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #22262d; color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; }
  .opt button.play.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .opt .note { flex: 1; font-size: 14px; }
  .opt .src { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; word-break: break-word; }
  .opt label.choose { flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); cursor: pointer; padding: 6px; }
  .none { margin-top: 8px; font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  button.small { border: 1px solid var(--line); background: #22262d; color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #111418ee; border-top: 1px solid var(--line); padding: 10px 16px; }
  footer .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  footer code { flex: 1; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Sound picks</h1>
  <p class="lead">Recorded sounds from the Sonniss libraries. Tap A, B or C to hear one, then tick the one you want for each sound. Tick "None of these" if all three miss. Your picks show at the bottom; copy them and send them over.</p>
  <div class="bar">
    <label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.05" value="0.8">
    <button class="small" id="stop">Stop</button>
  </div>
  <div id="list">Loading…</div>
</main>
<footer><div class="in"><code id="summary">No picks yet</code><button class="small" id="copy">Copy picks</button></div></footer>
<script>
(function () {
  var picks = {};
  try { picks = JSON.parse(localStorage.getItem("ksSoundPicks") || "{}"); } catch (e) {}
  function save() { try { localStorage.setItem("ksSoundPicks", JSON.stringify(picks)); } catch (e) {} }
  var vol = document.getElementById("vol"), current = null, currentBtn = null, rows = [];
  function stop() { if (current) { current.pause(); current = null; } if (currentBtn) { currentBtn.classList.remove("on"); currentBtn = null; } }
  document.getElementById("stop").onclick = stop;
  vol.oninput = function () { if (current) current.volume = +vol.value; };
  function play(key, btn) {
    stop();
    var a = new Audio(key + ".m4a?v=" + Date.now()); a.volume = +vol.value; a.play();
    current = a; currentBtn = btn; btn.classList.add("on");
    a.onended = function () { if (currentBtn === btn) { btn.classList.remove("on"); currentBtn = null; current = null; } };
  }
  function summary() {
    var parts = rows.map(function (r) { var p = picks[r.n]; return p ? "#" + r.n + " " + (p === "none" ? "none" : p) : null; }).filter(Boolean);
    document.getElementById("summary").textContent = parts.length ? parts.length + "/" + rows.length + ": " + parts.join(", ") : "No picks yet";
    return parts.join(", ");
  }
  document.getElementById("copy").onclick = function () {
    var t = "Sound picks: " + summary();
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { document.getElementById("copy").textContent = "Copied"; setTimeout(function () { document.getElementById("copy").textContent = "Copy picks"; }, 1500); });
  };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  fetch("list.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (list) {
    rows = list; var out = "", group = "";
    list.forEach(function (r) {
      if (r.group !== group) { group = r.group; out += "<h2>" + esc(group) + "</h2>"; }
      out += '<div class="row" data-n="' + r.n + '"><div class="head"><span class="name">#' + r.n + " " + esc(r.name) + '</span><span class="eg">' + esc(r.eg) + '</span></div><div class="opts">';
      r.opts.forEach(function (o) {
        var letter = o.key.replace(/^\d+/, "");
        var src = (o.src || []).map(function (s) { return s.file.replace(/\.wav$/i, ""); }).filter(function (f, i, a) { return a.indexOf(f) === i; }).join(" + ");
        out += '<div class="opt' + (picks[r.n] === letter ? " picked" : "") + '" data-letter="' + letter + '"><button class="play" data-key="' + o.key + '">' + letter + '</button><span class="note">' + esc(o.note) + '<span class="src">' + esc(src) + '</span></span><label class="choose"><input type="radio" name="p' + r.n + '" value="' + letter + '"' + (picks[r.n] === letter ? " checked" : "") + "> Pick</label></div>";
      });
      out += '</div><label class="none"><input type="radio" name="p' + r.n + '" value="none"' + (picks[r.n] === "none" ? " checked" : "") + "> None of these</label></div>";
    });
    var el = document.getElementById("list"); el.innerHTML = out;
    el.addEventListener("click", function (e) { var b = e.target.closest("button.play"); if (b) play(b.getAttribute("data-key"), b); });
    el.addEventListener("change", function (e) {
      var row = e.target.closest(".row"), n = row.getAttribute("data-n"); picks[n] = e.target.value; save();
      row.querySelectorAll(".opt").forEach(function (o) { o.classList.toggle("picked", o.getAttribute("data-letter") === e.target.value); });
      summary();
    });
    summary();
  }).catch(function () { document.getElementById("list").textContent = "The sound list didn't load."; });
})();
</script>
</body>
</html>
